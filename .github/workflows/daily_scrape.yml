name: Daily PPI Scraping

on:
  schedule:
    # 日本時間 午前3時 (UTC 18:00)、月曜日〜金曜日のみ（土日除外）
    - cron: '0 18 * * 1-5'
  workflow_dispatch: # 手動実行も可能にする

# 最後の「Keep workflow alive」で enableWorkflow を呼ぶため actions: write が要る。
# これが無いと "Resource not accessible by integration" で毎回失敗し、
# 自動無効化を防ぐはずの仕組みが機能しないまま 60 日で止まる（2026-08 に発生）。
permissions:
  contents: read
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      # Chrome / ChromeDriver の導入はやめた。scrape_kkj.py は requests + BeautifulSoup だけで、ブラウザを使っていない。
      # 2026-11 にランナーの OS が新しくなって apt-key が無くなり、使っていない Chrome の導入で毎回失敗していた(11/3 以降)。

      - name: Install Python dependencies
        run: |
          pip install -r scripts/requirements.txt
      
      - name: Test network connectivity
        run: |
          # 接続先は scripts/scrape_kkj.py の BASE_URL に合わせる。
          # 以前は www.pps.go.jp を見ていたが解決できず、毎回 "DNS lookup failed" が
          # ログに出ていた（実際のスクレイプ対象ではないので実害はなかった）。
          echo "Testing DNS resolution..."
          nslookup www.kkj.go.jp || echo "DNS lookup failed"
          echo "Testing HTTP connection..."
          curl -I https://www.kkj.go.jp/ || echo "HTTP connection failed"
      
      - name: Run scraping script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python scripts/scrape_kkj.py

      - name: Keep workflow alive
        uses: actions/github-script@v7
        with:
          script: |
            // GitHubは60日間コミットがないとスケジュール実行を無効化する
            // この処理でワークフローを明示的に有効化し続ける
            await github.rest.actions.enableWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'daily_scrape.yml'
            })

