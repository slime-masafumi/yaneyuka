name: Collect News

# NEWS の記事を集めて Firestore(news-archive)に貯める。/api/news はそれを読むだけ。
# スクリプト: scripts/collect-news.ts(配信元は src/lib/newsSources.ts)
# 実行結果の要約に配信元ごとの状態が出る。止まった配信元は warning になる。

on:
  schedule:
    # 30 分ごと(GitHub の都合で数分〜十数分遅れることがある)
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 使うのは firebase-admin だけなので、プロジェクト全体の npm ci はしない(毎回 1 分以上かかる)
      - name: Install firebase-admin
        run: |
          mkdir -p "$RUNNER_TEMP/deps"
          cd "$RUNNER_TEMP/deps"
          npm init -y > /dev/null
          npm install --no-audit --no-fund firebase-admin@13 > /dev/null
          ln -s "$RUNNER_TEMP/deps/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Collect
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node --import ./scripts/lib/register-ts.mjs scripts/collect-news.ts

      - name: Keep workflow alive
        uses: actions/github-script@v7
        with:
          script: |
            // 60 日間コミットが無いとスケジュールが自動停止するため、毎回有効化し直す
            await github.rest.actions.enableWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'collect-news.yml'
            })
