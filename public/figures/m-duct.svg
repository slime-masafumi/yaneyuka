  <line x1="34" y1="60" x2="164" y2="60" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <text x="99" y="54" font-size="12" fill="#2E7D6B" text-anchor="middle">a</text>
  <line x1="168" y1="84" x2="184" y2="84" stroke="#9a9a96" stroke-width="0.6"/>
  <line x1="168" y1="150" x2="184" y2="150" stroke="#9a9a96" stroke-width="0.6"/>
  <line x1="178" y1="84" x2="178" y2="150" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <text x="172" y="121" font-size="12" fill="#2E7D6B">b</text>
  <line x1="161" y1="147" x2="152" y2="186" stroke="#141414" stroke-width="0.6"/>
  <rect x="150" y="184" width="4" height="4" fill="#141414"/>
  <text x="146" y="190" font-size="11" fill="#141414" text-anchor="end">角のはぜ(継目)</text>
  <text x="20" y="214" font-size="10.5" fill="#5c5c5a">寸法は a×b(長辺×短辺)</text>
  <text x="20" y="230" font-size="10.5" fill="#5c5c5a">a/b は 4 以下が目安</text>
  <rect x="206" y="76" width="140" height="70" fill="none" stroke="#141414" stroke-width="1.2"/>
  <line x1="206" y1="129.5" x2="214" y2="146" stroke="#141414" stroke-width="0.8"/>
