  <line x1="358" y1="76" x2="358" y2="146" stroke="#141414" stroke-width="0.6" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="350" y="164" font-size="12" fill="#141414" text-anchor="end">φD</text>
  <line x1="258" y1="112" x2="210" y2="186" stroke="#141414" stroke-width="0.6"/>
  <rect x="208" y="184" width="4" height="4" fill="#141414"/>
