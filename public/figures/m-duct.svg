  <text x="388" y="190" font-size="11" fill="#141414">蛇腹状(φ100〜300)</text>
  <text x="388" y="214" font-size="10.5" fill="#5c5c5a">曲げやすいが通風抵抗が</text>
  <text x="388" y="230" font-size="10.5" fill="#5c5c5a">大きい。長さを抑える</text>
  <path fill-rule="evenodd" d="M572,84 h124 v70 h-124 Z M584,96 h100 v46 h-100 Z" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <line x1="700" y1="84" x2="714" y2="84" stroke="#9a9a96" stroke-width="0.6"/>
  <line x1="700" y1="96" x2="714" y2="96" stroke="#9a9a96" stroke-width="0.6"/>
  <line x1="708" y1="72" x2="708" y2="84" stroke="#141414" stroke-width="0.6" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <line x1="708" y1="96" x2="708" y2="108" stroke="#141414" stroke-width="0.6" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="704" y="68" font-size="12" fill="#141414">t</text>
  <text x="560" y="190" font-size="11" fill="#141414">断熱材と一体のパネル</text>
  <text x="560" y="214" font-size="10.5" fill="#5c5c5a">t = 20〜25(表)</text>
  <text x="560" y="230" font-size="10.5" fill="#5c5c5a">強度・清掃性は鋼板に劣る</text>
  <line x1="20" y1="252" x2="700" y2="252" stroke="#e6e6e2" stroke-width="1"/>
  <text x="20" y="274" font-size="10.5" fill="#5c5c5a">鋼板ダクト(亜鉛めっき・ステンレス)の板厚は表の目安。角ダクトは長辺 a が大きいほど板厚と補強を増す</text>
