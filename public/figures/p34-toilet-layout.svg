<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>便所ブースと小便器の寸法の目安</title>
  <defs>
    <marker id="tk" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 7 L7 1" stroke="#141414" stroke-width="1"/></marker>
    <marker id="tka" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 7 L7 1" stroke="#2E7D6B" stroke-width="1.2"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a96" stroke-width="0.6"/></pattern>
  </defs>
  <text x="20" y="22" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">PLAN — 平面</text>

  <!-- 壁 -->
  <rect x="40" y="40" width="490" height="12" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <rect x="40" y="52" width="12" height="190" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>

  <!-- ブース -->
  <g stroke="#141414" stroke-width="1" fill="none">
    <line x1="160" y1="52" x2="160" y2="232"/><line x1="268" y1="52" x2="268" y2="232"/>
    <path d="M52 232 H70 M142 232 H178 M250 232 H268"/>
    <line x1="142" y1="232" x2="142" y2="160"/><line x1="250" y1="232" x2="250" y2="160"/>
  </g>
  <g stroke="#9a9a96" stroke-width="0.6" fill="none" stroke-dasharray="3 3">
    <path d="M70 232 A72 72 0 0 1 142 160"/><path d="M178 232 A72 72 0 0 1 250 160"/>
  </g>
  <!-- 便器 -->
  <g stroke="#141414" stroke-width="1" fill="#f5f5f2">
    <rect x="86" y="52" width="40" height="14"/><ellipse cx="106" cy="94" rx="16" ry="24"/>
    <rect x="194" y="52" width="40" height="14"/><ellipse cx="214" cy="94" rx="16" ry="24"/>
  </g>
  <line x1="106" y1="52" x2="106" y2="250" stroke="#9a9a96" stroke-width="0.6" stroke-dasharray="3 3"/>

  <!-- ブース寸法(主題) -->
  <line x1="52" y1="256" x2="106" y2="256" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <text x="79" y="274" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#2E7D6B" text-anchor="middle">450</text>
  <line x1="160" y1="256" x2="268" y2="256" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <line x1="160" y1="232" x2="160" y2="262" stroke="#2E7D6B" stroke-width="0.6"/>
  <line x1="268" y1="232" x2="268" y2="262" stroke="#2E7D6B" stroke-width="0.6"/>
  <text x="214" y="274" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#2E7D6B" text-anchor="middle">900</text>
  <line x1="290" y1="52" x2="290" y2="232" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <line x1="268" y1="232" x2="296" y2="232" stroke="#2E7D6B" stroke-width="0.6"/>
  <text x="296" y="146" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#2E7D6B">1500</text>

  <!-- 小便器 -->
  <g stroke="#141414" stroke-width="1" fill="#f5f5f2">
    <path d="M362 52 V66 Q362 76 380 76 Q398 76 398 66 V52"/>
    <path d="M440 52 V66 Q440 76 458 76 Q476 76 476 66 V52"/>
  </g>
  <g stroke="#9a9a96" stroke-width="0.6" stroke-dasharray="3 3">
    <line x1="380" y1="52" x2="380" y2="110"/><line x1="458" y1="52" x2="458" y2="110"/>
  </g>
  <line x1="380" y1="104" x2="458" y2="104" stroke="#141414" stroke-width="0.8" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="419" y="98" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#141414" text-anchor="middle">600〜700</text>
  <line x1="510" y1="76" x2="510" y2="184" stroke="#141414" stroke-width="0.8" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <line x1="476" y1="76" x2="516" y2="76" stroke="#141414" stroke-width="0.4"/>
  <line x1="440" y1="184" x2="516" y2="184" stroke="#9a9a96" stroke-width="0.6" stroke-dasharray="3 3"/>
  <text x="504" y="134" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#141414" text-anchor="end">900以上</text>
  <text x="380" y="210" font-size="11" fill="#141414">小便器</text>
  <text x="380" y="226" font-size="10.5" fill="#5c5c5a">中心間と前方の空き</text>

  <!-- 注記 -->
  <line x1="548" y1="40" x2="548" y2="270" stroke="#e6e6e2" stroke-width="1"/>
  <text x="564" y="58" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1" fill="#9a9a96">目安 / mm</text>
  <text x="564" y="86" font-size="11" fill="#141414">洋式ブース</text>
  <text x="564" y="102" font-size="10.5" fill="#5c5c5a">900×1500 程度</text>
  <text x="564" y="118" font-size="10.5" fill="#5c5c5a">便器中心→壁 450以上</text>
  <text x="564" y="146" font-size="11" fill="#141414">小便器</text>
  <text x="564" y="162" font-size="10.5" fill="#5c5c5a">中心間 600〜700</text>
  <text x="564" y="178" font-size="10.5" fill="#5c5c5a">前方 900以上</text>
  <text x="564" y="206" font-size="11" fill="#141414">車椅子使用者用</text>
  <text x="564" y="222" font-size="10.5" fill="#5c5c5a">直径1500の回転域を</text>
  <text x="564" y="238" font-size="10.5" fill="#5c5c5a">確保(設計標準)</text>
</svg>
