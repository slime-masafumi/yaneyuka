<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>個別分散方式とセントラル方式の系統</title>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a96" stroke-width="0.6"/></pattern>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#141414" stroke-width="1"/></marker>
  </defs>

  <text x="20" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">DIAGRAM — 個別分散方式</text>
  <text x="380" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">DIAGRAM — セントラル方式</text>
  <line x1="360" y1="16" x2="360" y2="296" stroke="#e6e6e2" stroke-width="1"/>

  <!-- ===== 左:個別分散 ===== -->
  <line x1="20" y1="290" x2="340" y2="290" stroke="#9a9a96" stroke-width="1"/>
  <rect x="40" y="70" width="280" height="6" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <rect x="40" y="140" width="280" height="6" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <rect x="40" y="210" width="280" height="6" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <line x1="40" y1="76" x2="40" y2="290" stroke="#141414" stroke-width="1"/>
  <line x1="320" y1="76" x2="320" y2="290" stroke="#141414" stroke-width="1"/>
  <!-- 室外機 -->
  <rect x="64" y="44" width="48" height="26" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <circle cx="88" cy="57" r="8" fill="none" stroke="#141414" stroke-width="0.8"/>
  <text x="120" y="61" font-size="11" fill="#141414">室外機(屋上)</text>
  <!-- 冷媒配管 -->
  <g fill="none" stroke="#2E7D6B" stroke-width="1.4">
    <path d="M88 70 V230"/>
    <path d="M88 86 H150 M190 86 H250"/>
    <path d="M88 156 H150 M190 156 H250"/>
    <path d="M88 226 H150 M190 226 H250"/>
  </g>
  <!-- 室内機 -->
  <g fill="#f5f5f2" stroke="#141414" stroke-width="1">
    <rect x="150" y="78" width="40" height="14"/><rect x="250" y="78" width="40" height="14"/>
    <rect x="150" y="148" width="40" height="14"/><rect x="250" y="148" width="40" height="14"/>
    <rect x="150" y="218" width="40" height="14"/><rect x="250" y="218" width="40" height="14"/>
  </g>
  <!-- 吹出し -->
  <g stroke="#9a9a96" stroke-width="0.8" fill="none">
    <path d="M160 166 L152 182" marker-end="url(#ar)"/><path d="M180 166 L188 182" marker-end="url(#ar)"/>
  </g>
  <!-- 引き出し -->
  <text x="96" y="124" font-size="11" fill="#2E7D6B">冷媒配管</text>
  <line x1="290" y1="232" x2="300" y2="258" stroke="#141414" stroke-width="0.6"/>
  <rect x="298" y="256" width="4" height="4" fill="#141414"/>
  <text x="296" y="276" font-size="11" fill="#141414" text-anchor="end">室内機(天井カセット等)</text>
  <text x="20" y="314" font-size="10.5" fill="#5c5c5a">冷媒で熱を運び、室内機ごとに能力を制御する。</text>
  <text x="20" y="330" font-size="10.5" fill="#5c5c5a">配管長・高低差はメーカーの制限内で計画。</text>

  <!-- ===== 右:セントラル ===== -->
  <line x1="380" y1="290" x2="700" y2="290" stroke="#9a9a96" stroke-width="1"/>
  <rect x="400" y="70" width="290" height="6" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <rect x="400" y="140" width="290" height="6" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <rect x="400" y="210" width="290" height="6" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <line x1="400" y1="76" x2="400" y2="290" stroke="#141414" stroke-width="1"/>
  <line x1="690" y1="76" x2="690" y2="290" stroke="#141414" stroke-width="1"/>
  <!-- 機械室 -->
  <line x1="508" y1="216" x2="508" y2="290" stroke="#141414" stroke-width="1"/>
  <text x="406" y="232" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1" fill="#9a9a96">機械室</text>
  <rect x="408" y="254" width="34" height="34" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <text x="425" y="275" font-size="10.5" fill="#141414" text-anchor="middle">熱源</text>
  <rect x="464" y="240" width="38" height="48" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <text x="483" y="268" font-size="10.5" fill="#141414" text-anchor="middle">AHU</text>
  <!-- 冷温水配管 -->
  <g fill="none" stroke="#2E7D6B" stroke-width="1.4">
    <path d="M442 262 H464"/><path d="M442 278 H464"/>
  </g>
  <!-- ダクト -->
  <g fill="none" stroke="#141414" stroke-width="1">
    <path d="M502 240 H520 V80 H676 V90 H528 V150 H676 V160 H528 V220 H676 V230 H528 V248 H502"/>
  </g>
  <!-- 吹出口 -->
  <g stroke="#141414" stroke-width="1">
    <line x1="580" y1="90" x2="580" y2="96"/><line x1="572" y1="96" x2="588" y2="96"/>
    <line x1="640" y1="90" x2="640" y2="96"/><line x1="632" y1="96" x2="648" y2="96"/>
    <line x1="580" y1="160" x2="580" y2="166"/><line x1="572" y1="166" x2="588" y2="166"/>
    <line x1="640" y1="160" x2="640" y2="166"/><line x1="632" y1="166" x2="648" y2="166"/>
    <line x1="580" y1="230" x2="580" y2="236"/><line x1="572" y1="236" x2="588" y2="236"/>
    <line x1="640" y1="230" x2="640" y2="236"/><line x1="632" y1="236" x2="648" y2="236"/>
  </g>
  <g stroke="#9a9a96" stroke-width="0.8" fill="none">
    <path d="M640 170 V188" marker-end="url(#ar)"/>
  </g>
  <!-- 引き出し -->
  <line x1="600" y1="85" x2="612" y2="112" stroke="#141414" stroke-width="0.6"/>
  <rect x="610" y="110" width="4" height="4" fill="#141414"/>
  <text x="620" y="117" font-size="11" fill="#141414">ダクト</text>
  <line x1="580" y1="236" x2="570" y2="262" stroke="#141414" stroke-width="0.6"/>
  <rect x="568" y="260" width="4" height="4" fill="#141414"/>
  <text x="578" y="267" font-size="11" fill="#141414">吹出口</text>
  <text x="440" y="306" font-size="10.5" fill="#2E7D6B">冷温水配管</text>
  <line x1="453" y1="296" x2="453" y2="280" stroke="#2E7D6B" stroke-width="0.6"/>
  <text x="380" y="330" font-size="10.5" fill="#5c5c5a">熱源 → 冷温水 → AHU で空気を処理 → ダクトで各室へ。</text>
</svg>
