<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>中央式給湯の循環(返湯)配管</title>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a96" stroke-width="0.6"/></pattern>
  </defs>
  <text x="20" y="22" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">DIAGRAM — 中央式給湯</text>

  <!-- 建物 -->
  <rect x="140" y="44" width="420" height="6" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <rect x="140" y="114" width="420" height="6" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <rect x="140" y="184" width="420" height="6" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <line x1="140" y1="50" x2="140" y2="260" stroke="#141414" stroke-width="1"/>
  <line x1="560" y1="50" x2="560" y2="260" stroke="#141414" stroke-width="1"/>
  <line x1="20" y1="260" x2="700" y2="260" stroke="#9a9a96" stroke-width="1"/>
  <line x1="262" y1="190" x2="262" y2="260" stroke="#141414" stroke-width="1"/>
  <text x="146" y="252" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1" fill="#9a9a96">機械室</text>

  <!-- 貯湯槽 -->
  <rect x="152" y="200" width="56" height="40" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <text x="180" y="224" font-size="11" fill="#141414" text-anchor="middle">貯湯槽</text>
  <!-- 給水 -->
  <path d="M40 232 H152" fill="none" stroke="#9a9a96" stroke-width="1"/>
  <text x="40" y="226" font-size="10.5" fill="#5c5c5a">給水</text>

  <!-- 給湯管(往き) -->
  <g fill="none" stroke="#141414" stroke-width="1.2">
    <path d="M180 200 V196 H290 V60"/>
    <path d="M290 60 H500"/><path d="M290 130 H500"/><path d="M290 196 V210 H500"/>
  </g>
  <!-- 給湯栓 -->
  <g stroke="#141414" stroke-width="1" fill="#f5f5f2">
    <path d="M360 60 V72 M430 60 V72 M360 130 V142 M430 130 V142 M360 210 V220 M430 210 V220" fill="none"/>
    <circle cx="360" cy="75" r="3"/><circle cx="430" cy="75" r="3"/>
    <circle cx="360" cy="145" r="3"/><circle cx="430" cy="145" r="3"/>
    <circle cx="360" cy="223" r="3"/><circle cx="430" cy="223" r="3"/>
  </g>

  <!-- 返湯管(主題) -->
  <g fill="none" stroke="#2E7D6B" stroke-width="1.5">
    <path d="M500 60 H524 V242 H244"/>
    <path d="M500 130 H524"/><path d="M500 210 H524"/>
    <path d="M228 242 H208"/>
  </g>
  <circle cx="236" cy="242" r="8" fill="#eef6f3" stroke="#2E7D6B" stroke-width="1.4"/>
  <text x="236" y="245.5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" fill="#2E7D6B" text-anchor="middle">P</text>

  <!-- 流れの向き -->
  <g fill="none" stroke="#9a9a96" stroke-width="0.8">
    <path d="M285 100 L290 92 L295 100"/>
    <path d="M519 92 L524 100 L529 92"/>
    <path d="M396 237 L388 242 L396 247"/>
  </g>

  <!-- ラベル -->
  <text x="298" y="100" font-size="11" fill="#141414">給湯管</text>
  <text x="516" y="170" font-size="11" fill="#2E7D6B" text-anchor="end">返湯管</text>
  <line x1="236" y1="250" x2="236" y2="272" stroke="#141414" stroke-width="0.6"/>
  <rect x="234" y="270" width="4" height="4" fill="#141414"/>
  <text x="244" y="276" font-size="11" fill="#141414">循環ポンプ</text>
  <line x1="430" y1="78" x2="452" y2="96" stroke="#141414" stroke-width="0.6"/>
  <rect x="450" y="94" width="4" height="4" fill="#141414"/>
  <text x="458" y="100" font-size="11" fill="#141414">給湯栓</text>

  <!-- 凡例・注記 -->
  <line x1="580" y1="70" x2="604" y2="70" stroke="#141414" stroke-width="1.2"/>
  <text x="610" y="74" font-size="10.5" fill="#5c5c5a">給湯管(往き)</text>
  <line x1="580" y1="92" x2="604" y2="92" stroke="#2E7D6B" stroke-width="1.5"/>
  <text x="610" y="96" font-size="10.5" fill="#5c5c5a">返湯管(還り)</text>
  <text x="580" y="130" font-size="10.5" fill="#5c5c5a">湯を常に回し</text>
  <text x="580" y="146" font-size="10.5" fill="#5c5c5a">末端まで温度を</text>
  <text x="580" y="162" font-size="10.5" fill="#5c5c5a">保つ</text>
  <line x1="20" y1="290" x2="700" y2="290" stroke="#e6e6e2" stroke-width="1"/>
  <text x="20" y="312" font-size="11" fill="#141414">貯湯槽内 60℃以上 ・ 末端の給湯栓 55℃以上</text>
  <text x="300" y="312" font-size="10.5" fill="#5c5c5a">レジオネラ症防止指針(平成15年厚生労働省告示第264号)</text>
</svg>
