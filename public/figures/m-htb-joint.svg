  <text x="20" y="314" font-size="10.5" fill="#5c5c5a">図は M20(SW=32・k=13、座金 21/40・t=4.5、ナット高さ 20)の比率。孔径は d が 27mm 以上で支障がなければ d+3mm まで</text>
