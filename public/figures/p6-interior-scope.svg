<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>内装制限が掛かる部分(居室と通路)</title>
  <defs>
    <marker id="tk" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 7 L7 1" stroke="#141414" stroke-width="1"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a96" stroke-width="0.6"/></pattern>
  </defs>

  <text x="20" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">SECTION — 断面</text>
  <text x="530" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">令128条の5 — 主な区分</text>
  <line x1="514" y1="16" x2="514" y2="284" stroke="#e6e6e2" stroke-width="1"/>

  <!-- 躯体 -->
  <g fill="url(#hatch)" stroke="#141414" stroke-width="1">
    <rect x="20" y="40" width="474" height="12"/>
    <rect x="20" y="236" width="474" height="12"/>
    <rect x="20" y="52" width="12" height="184"/>
    <rect x="322" y="52" width="10" height="184"/>
    <rect x="482" y="52" width="12" height="184"/>
  </g>
  <!-- 天井 -->
  <line x1="32" y1="76" x2="322" y2="76" stroke="#141414" stroke-width="1"/>
  <line x1="332" y1="76" x2="482" y2="76" stroke="#141414" stroke-width="1"/>

  <!-- 制限を受ける仕上げ面 -->
  <g stroke="#2E7D6B" stroke-width="1.5" fill="none">
    <line x1="32" y1="79" x2="322" y2="79"/>
    <line x1="35" y1="79" x2="35" y2="165"/>
    <line x1="319" y1="79" x2="319" y2="165"/>
    <line x1="332" y1="79" x2="482" y2="79"/>
    <line x1="335" y1="79" x2="335" y2="236"/>
    <line x1="479" y1="79" x2="479" y2="236"/>
  </g>

  <!-- 1.2m -->
  <line x1="32" y1="165" x2="322" y2="165" stroke="#9a9a96" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="56" y1="236" x2="56" y2="165" stroke="#141414" stroke-width="0.6" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="62" y="204" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#141414">1.2m</text>
  <text x="200" y="208" font-size="10.5" fill="#5c5c5a" text-anchor="middle">床から 1.2m 以下の壁は対象外</text>

  <!-- 居室 -->
  <text x="177" y="104" font-size="12" fill="#141414" text-anchor="middle">居室(特殊建築物の用途)</text>
  <text x="177" y="126" font-size="11" fill="#2E7D6B" text-anchor="middle">壁(1.2m超)・天井 = 難燃材料</text>
  <text x="177" y="143" font-size="10.5" fill="#5c5c5a" text-anchor="middle">3階以上に居室がある建物の天井は準不燃</text>

  <!-- 通路 -->
  <text x="407" y="104" font-size="12" fill="#141414" text-anchor="middle">廊下・階段等</text>
  <text x="407" y="126" font-size="11" fill="#2E7D6B" text-anchor="middle">壁・天井とも全面</text>
  <text x="407" y="143" font-size="11" fill="#2E7D6B" text-anchor="middle">準不燃材料</text>
  <text x="407" y="208" font-size="10.5" fill="#5c5c5a" text-anchor="middle">地上へ通ずる主たる通路</text>

  <text x="20" y="272" font-size="10.5" fill="#5c5c5a">回り縁・窓台等は除く。図は令128条の5第1項(特殊建築物)の例</text>

  <!-- 区分 -->
  <g font-size="11" fill="#141414">
    <text x="530" y="56">1項・4項 居室</text>
    <text x="530" y="98">2項 自動車車庫等</text>
    <text x="530" y="140">3項 地階の居室(特定用途)</text>
    <text x="530" y="182">5項 無窓の居室</text>
    <text x="530" y="224">6項 調理室等(火気使用)</text>
  </g>
  <g font-size="10.5" fill="#5c5c5a">
    <text x="530" y="73">難燃(1.2m以下の壁は除く)</text>
    <text x="530" y="115">準不燃(壁・天井全面)</text>
    <text x="530" y="157">準不燃(壁・天井全面)</text>
    <text x="530" y="199">準不燃(壁・天井全面)</text>
    <text x="530" y="241">準不燃(壁・天井全面)</text>
  </g>
  <g stroke="#e6e6e2" stroke-width="1">
    <line x1="530" y1="82" x2="700" y2="82"/>
    <line x1="530" y1="124" x2="700" y2="124"/>
    <line x1="530" y1="166" x2="700" y2="166"/>
    <line x1="530" y1="208" x2="700" y2="208"/>
  </g>
  <text x="530" y="272" font-size="10.5" fill="#5c5c5a">1〜5項は主たる通路も準不燃</text>
</svg>
