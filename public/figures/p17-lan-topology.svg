<svg xmlns="http://www.w3.org/2000/svg" fill="#141414" viewBox="0 0 720 330" width="720" height="330" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>MDF・IDF と LAN 配線の構成</title>
  <style>
    text{font-size:11px}
    .s{font-size:10.5px;fill:#5c5c5a}
    .m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px}
    .t{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:1.2px;fill:#9a9a96}
    .a{fill:#2E7D6B}
    .k{stroke:#141414;stroke-width:1;fill:none}
    .b{stroke:#141414;stroke-width:1;fill:#f5f5f2}
    .g{stroke:#9a9a96;stroke-width:.8;fill:none}
    .d{stroke-dasharray:3 3}
    .c{stroke:#2E7D6B;stroke-width:1.5;fill:none}
    .h{stroke:#e6e6e2;stroke-width:1}
  </style>
  <defs>
    <pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a96" stroke-width="0.6"/></pattern>
  </defs>

  <text x="20" y="24" class="t">SECTION — 断面(系統)</text>

  <!-- スラブ -->
  <g fill="url(#hp)" stroke="#141414" stroke-width="1">
    <rect x="150" y="56" width="380" height="8"/>
    <rect x="150" y="132" width="380" height="8"/>
    <rect x="150" y="208" width="380" height="8"/>
  </g>
  <line x1="120" y1="292" x2="540" y2="292" class="k"/>
  <rect x="120" y="292" width="420" height="6" fill="url(#hp)"/>
  <text x="156" y="128" class="m" fill="#9a9a96">3F</text>
  <text x="156" y="204" class="m" fill="#9a9a96">2F</text>
  <text x="156" y="288" class="m" fill="#9a9a96">1F</text>

  <!-- DPS -->
  <path class="g d" d="M204 64 V292 M232 64 V292"/>
  <text x="218" y="50" class="m" fill="#5c5c5a" text-anchor="middle">DPS</text>

  <!-- 外部回線 → MDF -->
  <text x="20" y="252">外部回線</text>
  <text x="20" y="268" class="s">光回線など</text>
  <line x1="80" y1="260" x2="250" y2="260" class="k"/>
  <rect x="250" y="236" width="36" height="56" class="b"/>
  <text x="268" y="268" class="m" text-anchor="middle">MDF</text>
  <rect x="290" y="268" width="28" height="24" class="b"/>
  <text x="304" y="284" class="m" font-size="9" text-anchor="middle">UPS</text>

  <!-- 光幹線 -->
  <path class="c" d="M250 248 H218 V100 H250 M218 176 H250"/>
  <rect x="250" y="160" width="36" height="32" class="b"/>
  <text x="268" y="180" class="m" text-anchor="middle">IDF</text>
  <rect x="250" y="84" width="36" height="32" class="b"/>
  <text x="268" y="104" class="m" text-anchor="middle">IDF</text>

  <!-- 水平配線 3F -->
  <path class="k" d="M286 92 H330 V72 H500 M380 72 V78 M435 72 V78 M500 72 V110"/>
  <rect x="371" y="78" width="18" height="8" class="k"/>
  <text x="380" y="100" class="m" text-anchor="middle">AP</text>
  <path class="k" d="M429 78 H441 L437 86 H433 Z"/>
  <text x="435" y="100" class="s" text-anchor="middle">カメラ</text>
  <rect x="494" y="110" width="12" height="10" class="k"/>
  <text x="488" y="119" class="s" text-anchor="end">情報コンセント</text>

  <!-- 水平配線 2F -->
  <path class="k" d="M286 168 H330 V148 H500 M380 148 V154 M435 148 V154 M500 148 V186"/>
  <rect x="371" y="154" width="18" height="8" class="k"/>
  <path class="k" d="M429 154 H441 L437 162 H433 Z"/>
  <rect x="494" y="186" width="12" height="10" class="k"/>

  <!-- 注記 -->
  <line x1="548" y1="56" x2="548" y2="292" class="h"/>
  <line x1="562" y1="76" x2="586" y2="76" class="c"/>
  <text x="562" y="96">光ファイバ幹線</text>
  <text x="562" y="112" class="s">MDF → 各階 IDF</text>
  <line x1="562" y1="140" x2="586" y2="140" class="k"/>
  <text x="562" y="160">Cat6 / Cat6A</text>
  <text x="562" y="176" class="s">IDF → 端末・AP</text>
  <text x="562" y="192" class="s">AP・カメラは PoE 給電</text>
  <text x="562" y="232" class="s">MDF:外部回線を収容</text>
  <text x="562" y="248" class="s">UPS 1〜3kVA 併設が多い</text>
  <text x="562" y="276" class="s">IDF:各階・ゾーンに設置</text>
</svg>
