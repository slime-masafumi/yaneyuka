<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>業務用エアコン 室内機の形状と天井の関係</title>
  <defs>
    <marker id="ara" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#2E7D6B" stroke-width="1.2"/></marker>
    <marker id="arg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#9a9a96" stroke-width="1"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a96" stroke-width="0.6"/></pattern>
  </defs>

  <text x="20" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">SECTION — 室内機の形状</text>

  <!-- スラブ・天井・床 -->
  <rect x="20" y="40" width="680" height="10" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <line x1="20" y1="130" x2="700" y2="130" stroke="#141414" stroke-width="1"/>
  <line x1="20" y1="236" x2="700" y2="236" stroke="#9a9a96" stroke-width="1"/>
  <g stroke="#e6e6e2" stroke-width="1">
    <line x1="156" y1="56" x2="156" y2="290"/><line x1="292" y1="56" x2="292" y2="290"/>
    <line x1="428" y1="56" x2="428" y2="290"/><line x1="564" y1="56" x2="564" y2="290"/>
  </g>

  <!-- 1 天井埋込カセット -->
  <line x1="66" y1="50" x2="66" y2="96" stroke="#141414" stroke-width="0.6"/>
  <line x1="110" y1="50" x2="110" y2="96" stroke="#141414" stroke-width="0.6"/>
  <rect x="58" y="96" width="60" height="34" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <rect x="50" y="130" width="76" height="4" fill="#141414"/>
  <line x1="56" y1="136" x2="36" y2="166" stroke="#2E7D6B" stroke-width="1.2" marker-end="url(#ara)"/>
  <line x1="120" y1="136" x2="140" y2="166" stroke="#2E7D6B" stroke-width="1.2" marker-end="url(#ara)"/>
  <line x1="88" y1="164" x2="88" y2="138" stroke="#9a9a96" stroke-width="0.8" marker-end="url(#arg)"/>

  <!-- 2 天井吊 -->
  <line x1="196" y1="50" x2="196" y2="146" stroke="#141414" stroke-width="0.6"/>
  <line x1="252" y1="50" x2="252" y2="146" stroke="#141414" stroke-width="0.6"/>
  <rect x="184" y="146" width="80" height="22" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <line x1="266" y1="164" x2="286" y2="192" stroke="#2E7D6B" stroke-width="1.2" marker-end="url(#ara)"/>

  <!-- 3 壁掛 -->
  <rect x="408" y="130" width="8" height="106" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <rect x="344" y="146" width="64" height="24" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <line x1="350" y1="172" x2="322" y2="200" stroke="#2E7D6B" stroke-width="1.2" marker-end="url(#ara)"/>

  <!-- 4 床置 -->
  <rect x="468" y="164" width="52" height="72" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <line x1="494" y1="160" x2="494" y2="138" stroke="#2E7D6B" stroke-width="1.2" marker-end="url(#ara)"/>
  <text x="496" y="94" font-size="10.5" fill="#9a9a96" text-anchor="middle">天井懐</text>

  <!-- 5 天井埋込ダクト -->
  <line x1="600" y1="50" x2="600" y2="74" stroke="#141414" stroke-width="0.6"/>
  <line x1="640" y1="50" x2="640" y2="74" stroke="#141414" stroke-width="0.6"/>
  <rect x="590" y="74" width="60" height="30" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <path d="M650 80 H676 V130 M650 98 H664 V130" fill="none" stroke="#141414" stroke-width="0.8"/>
  <rect x="660" y="130" width="20" height="3" fill="#141414"/>
  <path d="M590 84 H578 V130 M590 98 H584 V130" fill="none" stroke="#9a9a96" stroke-width="0.8"/>
  <rect x="574" y="130" width="14" height="3" fill="#9a9a96"/>
  <line x1="670" y1="136" x2="670" y2="166" stroke="#2E7D6B" stroke-width="1.2" marker-end="url(#ara)"/>

  <!-- 名前 -->
  <g font-size="11" fill="#141414" text-anchor="middle">
    <text x="88" y="258">天井埋込カセット</text>
    <text x="224" y="258">天井吊</text>
    <text x="360" y="258">壁掛</text>
    <text x="496" y="258">床置</text>
    <text x="632" y="258">天井埋込ダクト</text>
  </g>
  <g font-size="10.5" fill="#5c5c5a" text-anchor="middle">
    <text x="88" y="276">1/2/4 方向吹出し</text>
    <text x="224" y="276">天井の開口が不要</text>
    <text x="360" y="276">小空間・個室向け</text>
    <text x="496" y="276">天井懐が足りない時</text>
    <text x="632" y="276">吹出口だけが見える</text>
  </g>
</svg>
