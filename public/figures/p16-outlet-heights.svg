<svg xmlns="http://www.w3.org/2000/svg" fill="#141414" viewBox="0 0 720 320" width="720" height="320" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>用途別のコンセント設置高さ</title>
  <style>
    text{font-size:11px}
    .s{font-size:10.5px;fill:#5c5c5a}
    .m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9.5px;fill:#5c5c5a}
    .t{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:1.2px;fill:#9a9a96}
    .k{stroke:#141414;stroke-width:1;fill:none}
    .g{stroke:#9a9a96;stroke-width:.8;fill:none}
    .c{stroke:#2E7D6B;stroke-width:1.2;fill:none}
    .h{stroke:#e6e6e2;stroke-width:1}
  </style>
  <defs>
    <marker id="ta" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 7 L7 1" stroke="#2E7D6B" stroke-width="1.2"/></marker>
    <pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a96" stroke-width="0.6"/></pattern>
    <g id="o"><rect x="-5" y="-7" width="10" height="14" fill="none" stroke="#141414"/><path d="M-2 -3 V0 M2 -3 V0" stroke="#141414"/></g>
  </defs>

  <text x="20" y="24" class="t">ELEVATION — 展開(FL からの目安)</text>

  <!-- 目盛 -->
  <path class="h" d="M70 200 H700 M70 130 H700 M70 60 H700"/>
  <line x1="70" y1="60" x2="70" y2="270" class="g"/>
  <path class="g" d="M66 235 H70 M66 200 H70 M66 165 H70 M66 130 H70 M66 95 H70 M66 60 H70"/>
  <text x="62" y="273" class="m" text-anchor="end">FL</text>
  <text x="62" y="238" class="m" text-anchor="end">250</text>
  <text x="62" y="203" class="m" text-anchor="end">500</text>
  <text x="62" y="168" class="m" text-anchor="end">750</text>
  <text x="62" y="133" class="m" text-anchor="end">1000</text>
  <text x="62" y="98" class="m" text-anchor="end">1250</text>
  <text x="62" y="63" class="m" text-anchor="end">1500</text>

  <!-- カウンター -->
  <rect x="290" y="151" width="60" height="119" fill="#f5f5f2" stroke="#9a9a96" stroke-width="0.8"/>

  <!-- FL -->
  <rect x="70" y="270" width="630" height="6" fill="url(#hp)"/>
  <line x1="70" y1="270" x2="700" y2="270" class="k"/>

  <!-- 1 一般 250-350 -->
  <line x1="130" y1="235" x2="130" y2="221" class="c" marker-start="url(#ta)" marker-end="url(#ta)"/>
  <use href="#o" x="116" y="228"/>
  <text x="138" y="224" class="m">350</text><text x="138" y="240" class="m">250</text>
  <text x="130" y="292" text-anchor="middle">一般</text>
  <text x="130" y="308" class="s" text-anchor="middle">住宅・事務所</text>

  <!-- 2 医療 800-1200 -->
  <line x1="225" y1="158" x2="225" y2="102" class="c" marker-start="url(#ta)" marker-end="url(#ta)"/>
  <use href="#o" x="211" y="130"/>
  <text x="233" y="105" class="m">1200</text><text x="233" y="161" class="m">800</text>
  <text x="225" y="292" text-anchor="middle">医療機器</text>

  <!-- 3 キッチン 900-1050 -->
  <line x1="320" y1="144" x2="320" y2="123" class="c" marker-start="url(#ta)" marker-end="url(#ta)"/>
  <use href="#o" x="306" y="132"/>
  <text x="328" y="122" class="m">1050</text><text x="328" y="140" class="m">900</text>
  <text x="320" y="292" text-anchor="middle">キッチン</text>
  <text x="320" y="308" class="s" text-anchor="middle">カウンター上</text>

  <!-- 4 飲食店 1000-1100 -->
  <line x1="415" y1="130" x2="415" y2="116" class="c" marker-start="url(#ta)" marker-end="url(#ta)"/>
  <use href="#o" x="401" y="121"/>
  <text x="423" y="111" class="m">1100</text><text x="423" y="127" class="m">1000</text>
  <text x="415" y="292" text-anchor="middle">飲食店</text>
  <text x="415" y="308" class="s" text-anchor="middle">カウンター</text>

  <!-- 5 複合機・清掃・厨房 1000-1200 -->
  <line x1="515" y1="130" x2="515" y2="102" class="c" marker-start="url(#ta)" marker-end="url(#ta)"/>
  <use href="#o" x="501" y="116"/>
  <text x="523" y="105" class="m">1200</text><text x="523" y="133" class="m">1000</text>
  <text x="515" y="292" text-anchor="middle">複合機・清掃用</text>
  <text x="515" y="308" class="s" text-anchor="middle">厨房機器(壁面)</text>

  <!-- 6 壁掛けTV 1200-1500 -->
  <line x1="625" y1="102" x2="625" y2="60" class="c" marker-start="url(#ta)" marker-end="url(#ta)"/>
  <use href="#o" x="611" y="81"/>
  <text x="633" y="63" class="m">1500</text><text x="633" y="105" class="m">1200</text>
  <text x="625" y="292" text-anchor="middle">壁掛けテレビ</text>
</svg>
