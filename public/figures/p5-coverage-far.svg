<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>建蔽率と容積率の求め方</title>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a96" stroke-width="0.6"/></pattern>
  </defs>

  <text x="40" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">PLAN — 平面</text>
  <text x="420" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">SECTION — 断面</text>
  <line x1="360" y1="16" x2="360" y2="300" stroke="#e6e6e2" stroke-width="1"/>

  <!-- 平面:敷地 -->
  <rect x="40" y="56" width="240" height="160" fill="none" stroke="#9a9a96" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="40" y="47" font-size="11" fill="#141414">敷地面積 <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#5c5c5a">例 200m²</tspan></text>
  <!-- 建築面積 -->
  <rect x="64" y="76" width="192" height="120" fill="#eef6f3" stroke="#2E7D6B" stroke-width="1.2"/>
  <text x="160" y="134" font-size="12" fill="#2E7D6B" text-anchor="middle">建築面積</text>
  <text x="160" y="151" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#5c5c5a" text-anchor="middle">例 120m²</text>
  <!-- 前面道路 -->
  <line x1="20" y1="226" x2="300" y2="226" stroke="#9a9a96" stroke-width="0.8"/>
  <line x1="20" y1="250" x2="300" y2="250" stroke="#9a9a96" stroke-width="0.8"/>
  <text x="160" y="242" font-size="10.5" fill="#5c5c5a" text-anchor="middle">前面道路</text>

  <text x="40" y="276" font-size="12" fill="#141414"><tspan fill="#2E7D6B">建蔽率</tspan> = 建築面積 ÷ 敷地面積</text>
  <text x="40" y="294" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#5c5c5a">例 120 ÷ 200 = 60%   法53条</text>

  <!-- 断面 -->
  <line x1="400" y1="216" x2="700" y2="216" stroke="#9a9a96" stroke-width="1"/>
  <rect x="400" y="216" width="300" height="8" fill="url(#hatch)" stroke="none"/>
  <line x1="420" y1="70" x2="420" y2="216" stroke="#9a9a96" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="660" y1="70" x2="660" y2="216" stroke="#9a9a96" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="540" y="62" font-size="10.5" fill="#5c5c5a" text-anchor="middle">敷地(幅は平面と同じ縮尺)</text>
  <g fill="#f5f5f2" stroke="#141414" stroke-width="1">
    <rect x="444" y="186" width="192" height="30"/>
    <rect x="444" y="156" width="192" height="30"/>
    <rect x="444" y="126" width="192" height="30"/>
  </g>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#141414" text-anchor="middle">
    <text x="540" y="205">1F 120m²</text>
    <text x="540" y="175">2F 120m²</text>
    <text x="540" y="145">3F 120m²</text>
  </g>
  <text x="540" y="112" font-size="11" fill="#141414" text-anchor="middle">延べ面積 = 1F + 2F + 3F = 360m²</text>

  <text x="420" y="276" font-size="12" fill="#141414">容積率 = 延べ面積 ÷ 敷地面積</text>
  <text x="420" y="294" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#5c5c5a">例 360 ÷ 200 = 180%   法52条</text>

  <line x1="20" y1="308" x2="700" y2="308" stroke="#e6e6e2" stroke-width="1"/>
  <text x="20" y="328" font-size="10.5" fill="#5c5c5a">限度は用途地域ごとに都市計画で定める。容積率は前面道路幅員(法52条2項)、建蔽率は角地等(法53条3項)で変わる</text>
</svg>
