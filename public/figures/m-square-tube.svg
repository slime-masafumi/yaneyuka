<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>角形鋼管の断面と寸法記号</title>
  <defs>
    <marker id="tk" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 7 L7 1" stroke="#141414" stroke-width="1"/></marker>
    <marker id="tka" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 7 L7 1" stroke="#2E7D6B" stroke-width="1.2"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a96" stroke-width="0.6"/></pattern>
  </defs>

  <text x="20" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">SECTION — 正方形 □</text>
  <text x="330" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">SECTION — 長方形</text>
  <line x1="310" y1="16" x2="310" y2="264" stroke="#e6e6e2" stroke-width="1"/>
  <line x1="520" y1="16" x2="520" y2="264" stroke="#e6e6e2" stroke-width="1"/>

  <!-- □100×100×4.5(1.6px/mm) -->
  <path fill-rule="evenodd" d="M104,50 H236 A14,14 0 0 1 250,64 V196 A14,14 0 0 1 236,210 H104 A14,14 0 0 1 90,196 V64 A14,14 0 0 1 104,50 Z M104.2,57.2 H235.8 A7,7 0 0 1 242.8,64.2 V195.8 A7,7 0 0 1 235.8,202.8 H104.2 A7,7 0 0 1 97.2,195.8 V64.2 A7,7 0 0 1 104.2,57.2 Z" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <!-- A -->
  <line x1="90" y1="214" x2="90" y2="240" stroke="#9a9a96" stroke-width="0.6"/>
  <line x1="250" y1="214" x2="250" y2="240" stroke="#9a9a96" stroke-width="0.6"/>
  <line x1="90" y1="234" x2="250" y2="234" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <text x="170" y="228" font-size="12" fill="#2E7D6B" text-anchor="middle">A</text>
  <line x1="254" y1="50" x2="280" y2="50" stroke="#9a9a96" stroke-width="0.6"/>
  <line x1="254" y1="210" x2="280" y2="210" stroke="#9a9a96" stroke-width="0.6"/>
  <line x1="274" y1="50" x2="274" y2="210" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <text x="282" y="134" font-size="12" fill="#2E7D6B">A</text>
  <!-- t -->
  <line x1="60" y1="130" x2="90" y2="130" stroke="#2E7D6B" stroke-width="1.2" marker-end="url(#tka)"/>
  <line x1="97.2" y1="130" x2="120" y2="130" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)"/>
  <text x="126" y="134" font-size="12" fill="#2E7D6B">t</text>
  <!-- 角の丸み -->
  <line x1="94" y1="54" x2="62" y2="40" stroke="#141414" stroke-width="0.6"/>
  <rect x="58" y="38" width="4" height="4" fill="#141414"/>
  <text x="20" y="44" font-size="11" fill="#141414">角R</text>
  <text x="20" y="262" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#5c5c5a"><tspan fill="#9a9a96">例</tspan><tspan dx="8">□100×100×4.5</tspan></text>

  <!-- 50×100×2.3(1.6px/mm) -->
  <path fill-rule="evenodd" d="M398,50 H462 A8,8 0 0 1 470,58 V202 A8,8 0 0 1 462,210 H398 A8,8 0 0 1 390,202 V58 A8,8 0 0 1 398,50 Z M397.7,53.7 H462.3 A4,4 0 0 1 466.3,57.7 V202.3 A4,4 0 0 1 462.3,206.3 H397.7 A4,4 0 0 1 393.7,202.3 V57.7 A4,4 0 0 1 397.7,53.7 Z" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <line x1="390" y1="214" x2="390" y2="240" stroke="#9a9a96" stroke-width="0.6"/>
  <line x1="470" y1="214" x2="470" y2="240" stroke="#9a9a96" stroke-width="0.6"/>
  <line x1="390" y1="234" x2="470" y2="234" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <text x="430" y="228" font-size="12" fill="#2E7D6B" text-anchor="middle">A</text>
  <line x1="474" y1="50" x2="500" y2="50" stroke="#9a9a96" stroke-width="0.6"/>
  <line x1="474" y1="210" x2="500" y2="210" stroke="#9a9a96" stroke-width="0.6"/>
  <line x1="494" y1="50" x2="494" y2="210" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <text x="502" y="134" font-size="12" fill="#2E7D6B">B</text>
  <line x1="364" y1="130" x2="390" y2="130" stroke="#2E7D6B" stroke-width="1.2" marker-end="url(#tka)"/>
  <line x1="393.7" y1="130" x2="414" y2="130" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)"/>
  <text x="350" y="134" font-size="12" fill="#2E7D6B">t</text>
  <text x="330" y="262" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#5c5c5a"><tspan fill="#9a9a96">例</tspan><tspan dx="8">■50×100×2.3</tspan></text>

  <!-- 説明 -->
  <g font-size="11" fill="#141414">
    <text x="540" y="58"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2E7D6B">A・B</tspan><tspan x="584">外法寸法</tspan></text>
    <text x="584" y="76" font-size="10.5" fill="#5c5c5a">(外面から外面)</text>
    <text x="540" y="102"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2E7D6B">t</tspan><tspan x="584">板厚</tspan></text>
    <text x="540" y="128"><tspan>角R</tspan><tspan x="584">角部の丸み</tspan></text>
  </g>
  <line x1="540" y1="148" x2="700" y2="148" stroke="#e6e6e2" stroke-width="1"/>
  <text x="540" y="172" font-size="10.5" fill="#5c5c5a">呼称は A×B×t(mm)</text>
  <text x="540" y="192" font-size="10.5" fill="#5c5c5a">表の □ は正方形、</text>
  <text x="540" y="210" font-size="10.5" fill="#5c5c5a">■ は長方形の断面</text>
  <text x="540" y="234" font-size="10.5" fill="#5c5c5a">2 例とも同じ縮尺</text>
  <text x="540" y="252" font-size="10.5" fill="#5c5c5a">角R の値は規格票で確認</text>
</svg>
