<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>換気方式と天井裏等の空気圧の確保</title>
  <defs>
    <marker id="ara" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#2E7D6B" stroke-width="1.2"/></marker>
  </defs>

  <text x="20" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">SECTION — 24時間換気の方式</text>
  <g stroke="#e6e6e2" stroke-width="1"><line x1="245" y1="40" x2="245" y2="256"/><line x1="475" y1="40" x2="475" y2="256"/></g>

  <!-- 共通の箱:天井裏 y 56–88、居室 y 88–196 -->
  <g fill="none" stroke="#141414" stroke-width="1">
    <rect x="30" y="56" width="190" height="140"/>
    <path d="M452 138 V196 H262 V56 H452 V122"/>
    <path d="M494 122 V56 H684 V196 H494 V138"/>
  </g>
  <g stroke="#141414" stroke-width="1">
    <line x1="30" y1="88" x2="220" y2="88"/><line x1="262" y1="88" x2="452" y2="88"/><line x1="494" y1="88" x2="684" y2="88"/>
  </g>
  <g fill="#f5f5f2"><rect x="31" y="57" width="188" height="30"/><rect x="263" y="57" width="188" height="30"/><rect x="495" y="57" width="188" height="30"/></g>
  <g font-size="10.5" fill="#9a9a96" text-anchor="middle">
    <text x="125" y="76">天井裏</text><text x="357" y="76">天井裏</text><text x="589" y="76">天井裏</text>
  </g>

  <!-- 送風機記号 -->
  <g fill="#f5f5f2" stroke="#141414" stroke-width="1">
    <circle cx="30" cy="130" r="8"/><circle cx="220" cy="130" r="8"/>
    <circle cx="262" cy="130" r="8"/>
    <circle cx="684" cy="130" r="8"/>
  </g>
  <g stroke="#141414" stroke-width="0.6">
    <path d="M25 125 L35 135 M35 125 L25 135 M215 125 L225 135 M225 125 L215 135 M257 125 L267 135 M267 125 L257 135 M679 125 L689 135 M689 125 L679 135"/>
  </g>

  <!-- 気流 -->
  <g stroke="#2E7D6B" stroke-width="1.2" marker-end="url(#ara)">
    <line x1="44" y1="130" x2="96" y2="130"/><line x1="150" y1="130" x2="204" y2="130"/>
    <line x1="276" y1="130" x2="328" y2="130"/><line x1="384" y1="130" x2="440" y2="130"/>
    <line x1="506" y1="130" x2="560" y2="130"/><line x1="614" y1="130" x2="668" y2="130"/>
  </g>
  <!-- 第3種:天井裏からも排気 -->
  <path d="M628 72 H670 V118" fill="none" stroke="#2E7D6B" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ara)"/>

  <!-- 圧力 -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#5c5c5a" text-anchor="middle">
    <text x="125" y="170">± 調整</text><text x="357" y="170">+ 正圧</text><text x="589" y="170">− 負圧</text>
  </g>

  <!-- 名前と措置 -->
  <g font-size="11" fill="#141414" text-anchor="middle">
    <text x="125" y="220">第1種 給気機 + 排気機</text>
    <text x="357" y="220">第2種 給気機 + 排気口</text>
    <text x="589" y="220">第3種 給気口 + 排気機</text>
  </g>
  <g font-size="10.5" fill="#5c5c5a" text-anchor="middle">
    <text x="125" y="238">給排気量の調整などで</text>
    <text x="125" y="252">居室の空気圧を確保</text>
    <text x="357" y="238">居室が正圧になるので</text>
    <text x="357" y="252">特別な措置は不要</text>
  </g>
  <g font-size="10.5" fill="#2E7D6B" text-anchor="middle">
    <text x="589" y="238">天井裏等からも排気して</text>
    <text x="589" y="252">居室の空気圧を確保</text>
  </g>

  <line x1="20" y1="264" x2="700" y2="264" stroke="#e6e6e2" stroke-width="1"/>
  <text x="20" y="282" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#5c5c5a"><tspan fill="#9a9a96">H15国交告274号</tspan><tspan dx="10">居室の空気圧 ≧ 天井裏等。気密層・通気止め、下地材の等級によるときは対象外</tspan></text>
</svg>
