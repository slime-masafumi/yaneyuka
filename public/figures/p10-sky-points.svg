<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>北側斜線の天空率の測定点</title>
  <defs>
    <marker id="tk" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 7 L7 1" stroke="#141414" stroke-width="1"/></marker>
  </defs>

  <text x="20" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">PLAN — 平面(低層住専の例)</text>
  <line x1="490" y1="16" x2="490" y2="244" stroke="#e6e6e2" stroke-width="1"/>

  <!-- 方位 -->
  <line x1="60" y1="110" x2="60" y2="70" stroke="#9a9a96" stroke-width="0.8"/>
  <path d="M55 78 L60 68 L65 78" fill="none" stroke="#9a9a96" stroke-width="0.8"/>
  <text x="60" y="126" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#9a9a96" text-anchor="middle">真北</text>

  <!-- 敷地・建物 -->
  <rect x="140" y="130" width="300" height="90" fill="none" stroke="#9a9a96" stroke-width="0.8"/>
  <rect x="180" y="150" width="200" height="56" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <text x="280" y="183" font-size="11" fill="#141414" text-anchor="middle">計画建築物</text>
  <text x="140" y="238" font-size="10.5" fill="#5c5c5a">敷地</text>
  <text x="290" y="122" font-size="10.5" fill="#5c5c5a" text-anchor="middle">北側隣地境界線</text>

  <!-- 敷地の両端から真北へ -->
  <line x1="140" y1="130" x2="140" y2="86" stroke="#9a9a96" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="440" y1="130" x2="440" y2="86" stroke="#9a9a96" stroke-width="0.8" stroke-dasharray="3 3"/>
  <!-- 基準線 -->
  <line x1="120" y1="82" x2="460" y2="82" stroke="#9a9a96" stroke-width="0.8"/>
  <text x="140" y="66" font-size="10.5" fill="#141414">基準線(測定点を置く線)</text>
  <!-- 測定点 -->
  <g fill="#2E7D6B">
    <circle cx="140" cy="82" r="2"/><circle cx="152" cy="82" r="2"/><circle cx="164" cy="82" r="2"/><circle cx="176" cy="82" r="2"/><circle cx="188" cy="82" r="2"/><circle cx="200" cy="82" r="2"/><circle cx="212" cy="82" r="2"/><circle cx="224" cy="82" r="2"/><circle cx="236" cy="82" r="2"/><circle cx="248" cy="82" r="2"/><circle cx="260" cy="82" r="2"/><circle cx="272" cy="82" r="2"/><circle cx="284" cy="82" r="2"/><circle cx="296" cy="82" r="2"/><circle cx="308" cy="82" r="2"/><circle cx="320" cy="82" r="2"/><circle cx="332" cy="82" r="2"/><circle cx="344" cy="82" r="2"/><circle cx="356" cy="82" r="2"/><circle cx="368" cy="82" r="2"/><circle cx="380" cy="82" r="2"/><circle cx="392" cy="82" r="2"/><circle cx="404" cy="82" r="2"/><circle cx="416" cy="82" r="2"/><circle cx="428" cy="82" r="2"/><circle cx="440" cy="82" r="2"/>
  </g>
  <!-- 間隔 -->
  <line x1="152" y1="94" x2="164" y2="94" stroke="#141414" stroke-width="0.6" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="170" y="98" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#141414">≤1m 均等</text>
  <!-- 4m -->
  <line x1="470" y1="130" x2="470" y2="82" stroke="#141414" stroke-width="0.6" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <line x1="440" y1="130" x2="474" y2="130" stroke="#141414" stroke-width="0.4"/>
  <line x1="460" y1="82" x2="474" y2="82" stroke="#141414" stroke-width="0.4"/>
  <text x="466" y="110" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#141414" text-anchor="end">4m</text>

  <!-- 説明 -->
  <text x="506" y="50" font-size="12" fill="#141414">Rs = (As − Ab) / As</text>
  <text x="506" y="66" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#9a9a96">令135条の5</text>
  <text x="506" y="90" font-size="10.5" fill="#5c5c5a">各測定点で、計画建築物の天空率が</text>
  <text x="506" y="106" font-size="10.5" fill="#5c5c5a">斜線に適合する建築物の天空率以上</text>
  <line x1="506" y1="120" x2="700" y2="120" stroke="#e6e6e2" stroke-width="1"/>
  <text x="506" y="140" font-size="11" fill="#141414">測定点の位置</text>
  <g font-size="10.5" fill="#5c5c5a">
    <text x="506" y="158">基準線</text><text x="552" y="158">4m 低層住専・田園住居</text>
    <text x="552" y="174">8m 中高層住専</text>
    <text x="506" y="192">間隔</text><text x="552" y="192">1m 以内 / 中高層 2m 以内</text>
    <text x="506" y="210">高さ</text><text x="552" y="210">敷地の地盤面</text>
  </g>
  <text x="506" y="232" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#9a9a96">法56条7項3号・令135条の11</text>
</svg>
