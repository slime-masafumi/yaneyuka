<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>天井の高さが異なる居室の平均天井高</title>
  <defs>
    <marker id="tk" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 7 L7 1" stroke="#141414" stroke-width="1"/></marker>
    <marker id="tka" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 7 L7 1" stroke="#2E7D6B" stroke-width="1.2"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a96" stroke-width="0.6"/></pattern>
  </defs>

  <text x="20" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">SECTION — 断面(勾配天井の例)</text>
  <line x1="390" y1="16" x2="390" y2="252" stroke="#e6e6e2" stroke-width="1"/>

  <!-- 躯体 (60px = 1m、床 y=250) -->
  <rect x="72" y="250" width="256" height="8" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <rect x="72" y="100" width="8" height="150" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <rect x="320" y="44" width="8" height="206" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <!-- 勾配天井 2.4m → 3.4m(屋根スラブ) -->
  <polygon points="72,108 328,44 328,36 72,100" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>

  <!-- 平均の高さ -->
  <line x1="80" y1="76" x2="320" y2="76" stroke="#2E7D6B" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="200" y1="250" x2="200" y2="76" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <text x="208" y="150" font-size="12" fill="#2E7D6B">平均 2.9m</text>
  <text x="208" y="166" font-size="10.5" fill="#2E7D6B">= 室の容積 ÷ 床面積</text>

  <!-- 最低 2.1m -->
  <line x1="80" y1="124" x2="190" y2="124" stroke="#9a9a96" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="86" y="140" font-size="10.5" fill="#5c5c5a">2.1m(最低)</text>

  <!-- 両端の高さ -->
  <line x1="60" y1="250" x2="60" y2="106" stroke="#141414" stroke-width="0.6" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <line x1="56" y1="106" x2="72" y2="106" stroke="#141414" stroke-width="0.4"/>
  <text x="52" y="182" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#141414" text-anchor="end">2.4</text>
  <line x1="344" y1="250" x2="344" y2="46" stroke="#141414" stroke-width="0.6" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <line x1="328" y1="46" x2="348" y2="46" stroke="#141414" stroke-width="0.4"/>
  <text x="352" y="152" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#141414">3.4</text>
  <line x1="80" y1="282" x2="320" y2="282" stroke="#141414" stroke-width="0.6" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="200" y="276" font-size="10.5" fill="#5c5c5a" text-anchor="middle">奥行 4.0m</text>

  <!-- 説明 -->
  <text x="410" y="52" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1.2" fill="#9a9a96">RULE — 令21条</text>
  <text x="410" y="78" font-size="11" fill="#141414">1項 居室の天井の高さは 2.1m 以上</text>
  <text x="410" y="100" font-size="11" fill="#141414">2項 室の床面から測る</text>
  <text x="436" y="118" font-size="11" fill="#141414">高さが異なる部分があるときは</text>
  <text x="436" y="136" font-size="11" fill="#2E7D6B">その平均の高さによる</text>
  <line x1="410" y1="154" x2="700" y2="154" stroke="#e6e6e2" stroke-width="1"/>
  <text x="410" y="176" font-size="10.5" fill="#5c5c5a">例 一様な勾配で 2.4m〜3.4m の室</text>
  <text x="410" y="192" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#5c5c5a">(2.4 + 3.4) ÷ 2 = 2.9m ≥ 2.1m</text>
  <text x="410" y="214" font-size="10.5" fill="#5c5c5a">一部が 2.1m を下回っても、平均で判定する</text>
  <text x="410" y="230" font-size="10.5" fill="#5c5c5a">廊下・便所など居室でない室には規定なし</text>
</svg>
