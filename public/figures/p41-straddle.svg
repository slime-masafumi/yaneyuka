<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>防火地域と準防火地域にまたがる建築物</title>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a96" stroke-width="0.6"/></pattern>
  </defs>

  <text x="20" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">PLAN — 防火壁なし</text>
  <text x="380" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">PLAN — 防火壁あり</text>
  <line x1="360" y1="16" x2="360" y2="240" stroke="#e6e6e2" stroke-width="1"/>

  <!-- 左:防火壁なし -->
  <text x="90" y="58" font-size="11" fill="#141414" text-anchor="middle">防火地域</text>
  <text x="250" y="58" font-size="11" fill="#141414" text-anchor="middle">準防火地域</text>
  <rect x="60" y="80" width="240" height="90" fill="#eef6f3" stroke="#141414" stroke-width="1"/>
  <line x1="160" y1="40" x2="160" y2="192" stroke="#9a9a96" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="230" y="122" font-size="11" fill="#2E7D6B" text-anchor="middle">全部に</text>
  <text x="230" y="138" font-size="11" fill="#2E7D6B" text-anchor="middle">防火地域の規定</text>
  <text x="160" y="210" font-size="10.5" fill="#5c5c5a" text-anchor="middle">地域の境界</text>

  <!-- 右:防火壁あり -->
  <text x="450" y="58" font-size="11" fill="#141414" text-anchor="middle">防火地域</text>
  <text x="610" y="58" font-size="11" fill="#141414" text-anchor="middle">準防火地域</text>
  <rect x="420" y="80" width="156" height="90" fill="#eef6f3" stroke="none"/>
  <rect x="420" y="80" width="240" height="90" fill="none" stroke="#141414" stroke-width="1"/>
  <line x1="520" y1="40" x2="520" y2="192" stroke="#9a9a96" stroke-width="0.8" stroke-dasharray="3 3"/>
  <rect x="576" y="80" width="8" height="90" fill="url(#hatch)" stroke="#2E7D6B" stroke-width="1.5"/>
  <text x="470" y="122" font-size="11" fill="#2E7D6B" text-anchor="middle">防火地域</text>
  <text x="470" y="138" font-size="11" fill="#2E7D6B" text-anchor="middle">の規定</text>
  <text x="622" y="122" font-size="11" fill="#141414" text-anchor="middle">準防火</text>
  <text x="622" y="138" font-size="11" fill="#141414" text-anchor="middle">の規定</text>
  <line x1="580" y1="170" x2="600" y2="204" stroke="#141414" stroke-width="0.6"/>
  <rect x="598" y="202" width="4" height="4" fill="#141414"/>
  <text x="608" y="208" font-size="10.5" fill="#141414">防火壁</text>
  <text x="608" y="224" font-size="10.5" fill="#5c5c5a">防火地域外に設ける</text>
  <text x="520" y="210" font-size="10.5" fill="#5c5c5a" text-anchor="end">地域の境界</text>

  <line x1="20" y1="240" x2="700" y2="240" stroke="#e6e6e2" stroke-width="1"/>
  <text x="20" y="258" font-size="10.5" fill="#5c5c5a">法65条2項。指定のない区域とまたがる場合も同じ考え方で、防火壁の外は規定を適用しない(法65条1項)</text>
  <text x="20" y="274" font-size="10.5" fill="#5c5c5a">判断は敷地ではなく建築物の位置で行う</text>
</svg>
