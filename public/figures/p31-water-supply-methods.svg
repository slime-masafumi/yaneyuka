<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>給水方式の比較(4 方式)</title>
  <text x="20" y="20" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">DIAGRAM — 給水方式</text>
  <line x1="185" y1="32" x2="185" y2="306" stroke="#e6e6e2" stroke-width="1"/>
  <line x1="357" y1="32" x2="357" y2="306" stroke="#e6e6e2" stroke-width="1"/>
  <line x1="529" y1="32" x2="529" y2="306" stroke="#e6e6e2" stroke-width="1"/>
  <line x1="20" y1="352" x2="700" y2="352" stroke="#141414" stroke-width="2"/>
  <text x="700" y="372" font-size="11" fill="#141414" text-anchor="end">水道本管(配水管)</text>
  <text x="20" y="372" font-size="10.5" fill="#5c5c5a">緑 = 給水の圧力をつくるもの</text>
  <text x="20" y="44" font-size="12" fill="#141414">直結直圧方式</text><text x="20" y="60" font-size="10.5" fill="#5c5c5a">本管の圧力だけで給水</text><text x="20" y="76" font-size="10.5" fill="#5c5c5a">受水槽なし</text><rect x="70" y="110" width="100" height="190" fill="none" stroke="#141414" stroke-width="1"/><line x1="70" y1="173" x2="170" y2="173" stroke="#141414" stroke-width="1"/><line x1="70" y1="236" x2="170" y2="236" stroke="#141414" stroke-width="1"/><line x1="20" y1="300" x2="184" y2="300" stroke="#9a9a96" stroke-width="1"/><circle cx="50" cy="324" r="6" fill="#f5f5f2" stroke="#141414" stroke-width="1"/><text x="50" y="327" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="8" fill="#141414" text-anchor="middle">M</text><path d="M50 352 V330" fill="none" stroke="#2E7D6B" stroke-width="1.4"/><path d="M50 318 V290 H120 V128" fill="none" stroke="#2E7D6B" stroke-width="1.4"/><g fill="none" stroke="#2E7D6B" stroke-width="1.4"><path d="M120 158 H148 V164"/><path d="M120 221 H148 V227"/><path d="M120 270 H148 V276"/></g><text x="60" y="344" font-size="10" fill="#5c5c5a">量水器</text><text x="192" y="44" font-size="12" fill="#141414">直結増圧方式</text><text x="192" y="60" font-size="10.5" fill="#5c5c5a">増圧ポンプで本管圧に上乗せ</text><text x="192" y="76" font-size="10.5" fill="#5c5c5a">受水槽なし</text><rect x="242" y="110" width="100" height="190" fill="none" stroke="#141414" stroke-width="1"/><line x1="242" y1="173" x2="342" y2="173" stroke="#141414" stroke-width="1"/><line x1="242" y1="236" x2="342" y2="236" stroke="#141414" stroke-width="1"/><line x1="192" y1="300" x2="356" y2="300" stroke="#9a9a96" stroke-width="1"/><circle cx="222" cy="324" r="6" fill="#f5f5f2" stroke="#141414" stroke-width="1"/><text x="222" y="327" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="8" fill="#141414" text-anchor="middle">M</text><path d="M222 352 V330 M222 318 V290 H254 M270 290 H292" fill="none" stroke="#141414" stroke-width="1"/><path d="M292 290 V128" fill="none" stroke="#141414" stroke-width="1"/><g fill="none" stroke="#141414" stroke-width="1"><path d="M292 158 H320 V164"/><path d="M292 221 H320 V227"/><path d="M292 270 H320 V276"/></g><circle cx="262" cy="290" r="8" fill="#eef6f3" stroke="#2E7D6B" stroke-width="1.4"/><text x="262" y="293.5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" fill="#2E7D6B" text-anchor="middle">P</text><text x="248" y="318" font-size="10.5" fill="#2E7D6B">増圧ポンプ</text><text x="364" y="44" font-size="12" fill="#141414">受水槽方式</text><text x="364" y="60" font-size="10.5" fill="#5c5c5a">受水槽に受け、ポンプで送水</text><text x="364" y="76" font-size="10.5" fill="#5c5c5a">受水槽あり(加圧ポンプ)</text><rect x="414" y="110" width="100" height="190" fill="none" stroke="#141414" stroke-width="1"/><line x1="414" y1="173" x2="514" y2="173" stroke="#141414" stroke-width="1"/><line x1="414" y1="236" x2="514" y2="236" stroke="#141414" stroke-width="1"/><line x1="364" y1="300" x2="528" y2="300" stroke="#9a9a96" stroke-width="1"/><circle cx="394" cy="324" r="6" fill="#f5f5f2" stroke="#141414" stroke-width="1"/><text x="394" y="327" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="8" fill="#141414" text-anchor="middle">M</text><path d="M394 352 V330 M394 318 V276 H422" fill="none" stroke="#141414" stroke-width="1"/><rect x="422" y="270" width="24" height="26" fill="#eef6f3" stroke="#2E7D6B" stroke-width="1.4"/><path d="M446 290 H450 M466 290 H476" fill="none" stroke="#141414" stroke-width="1"/><circle cx="458" cy="290" r="8" fill="#eef6f3" stroke="#2E7D6B" stroke-width="1.4"/><text x="458" y="293.5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" fill="#2E7D6B" text-anchor="middle">P</text><path d="M476 290 V128" fill="none" stroke="#141414" stroke-width="1"/><g fill="none" stroke="#141414" stroke-width="1"><path d="M476 158 H502 V164"/><path d="M476 221 H502 V227"/><path d="M476 270 H502 V276"/></g><text x="410" y="318" font-size="10.5" fill="#2E7D6B">受水槽 + 加圧ポンプ</text><text x="536" y="44" font-size="12" fill="#141414">高置水槽方式</text><text x="536" y="60" font-size="10.5" fill="#5c5c5a">揚水し、屋上の槽から重力で</text><text x="536" y="76" font-size="10.5" fill="#5c5c5a">受水槽 + 高置水槽</text><rect x="586" y="110" width="100" height="190" fill="none" stroke="#141414" stroke-width="1"/><line x1="586" y1="173" x2="686" y2="173" stroke="#141414" stroke-width="1"/><line x1="586" y1="236" x2="686" y2="236" stroke="#141414" stroke-width="1"/><line x1="536" y1="300" x2="700" y2="300" stroke="#9a9a96" stroke-width="1"/><circle cx="566" cy="324" r="6" fill="#f5f5f2" stroke="#141414" stroke-width="1"/><text x="566" y="327" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="8" fill="#141414" text-anchor="middle">M</text><path d="M566 352 V330 M566 318 V276 H594" fill="none" stroke="#141414" stroke-width="1"/><rect x="594" y="270" width="24" height="26" fill="#f5f5f2" stroke="#141414" stroke-width="1"/><path d="M618 290 H622 M638 290 H648" fill="none" stroke="#141414" stroke-width="1"/><circle cx="630" cy="290" r="8" fill="#f5f5f2" stroke="#141414" stroke-width="1"/><text x="630" y="293.5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" fill="#141414" text-anchor="middle">P</text><path d="M648 290 V98" fill="none" stroke="#141414" stroke-width="1"/><rect x="636" y="76" width="44" height="22" fill="#eef6f3" stroke="#2E7D6B" stroke-width="1.4"/><path d="M640 98 V110 M676 98 V110" stroke="#141414" stroke-width="1"/><path d="M668 98 V262" fill="none" stroke="#141414" stroke-width="1"/><g fill="none" stroke="#141414" stroke-width="1"><path d="M668 158 H680 V164"/><path d="M668 221 H680 V227"/><path d="M668 262 H680 V268"/></g><text x="582" y="318" font-size="10.5" fill="#5c5c5a">受水槽 + 揚水ポンプ</text><text x="632" y="92" font-size="10.5" fill="#2E7D6B" text-anchor="end">高置水槽</text>
</svg>
