  <text x="616" y="246" font-size="10.5" fill="#5c5c5a" text-anchor="middle">厚さ 1.2</text>
  <text x="616" y="262" font-size="10.5" fill="#5c5c5a" text-anchor="middle">内径 ≒ 46.2</text>
  <text x="616" y="280" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#9a9a96" text-anchor="middle">JIS G 3448</text>
  <line x1="20" y1="294" x2="700" y2="294" stroke="#e6e6e2" stroke-width="1"/>
  <text x="20" y="314" font-size="11" fill="#141414"><tspan fill="#2E7D6B">呼び径の数字は外径でも内径でもない</tspan><tspan dx="12">SGP 40A と SUS 50Su は外径が同じ 48.6、VP と VU は外径が同じで厚さが違う</tspan></text>
  <text x="20" y="330" font-size="10.5" fill="#5c5c5a">寸法は表の基準寸法(mm)。内径は外径 − 2×厚さ の計算値。継手・支持金物は管種ごとに選ぶ</text>
</svg>
