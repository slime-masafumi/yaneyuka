  <text x="272" y="246" font-size="10.5" fill="#5c5c5a" text-anchor="middle">厚さ 3.6</text>
  <text x="272" y="262" font-size="10.5" fill="#5c5c5a" text-anchor="middle">内径 ≒ 40.8</text>
  <text x="272" y="280" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#9a9a96" text-anchor="middle">JIS K 6741</text>
