  <line x1="20" y1="244" x2="700" y2="244" stroke="#e6e6e2" stroke-width="1"/>
  <text x="20" y="266" font-size="11" fill="#141414"><tspan fill="#2E7D6B">製品寸法 = 呼び寸法 − 目地幅</tspan><tspan dx="12">例 呼び 400×200、目地 10 → 390×190(mm)</tspan></text>
  <text x="20" y="284" font-size="10.5" fill="#5c5c5a">JIS A 5406 は呼び寸法の範囲(長さ 300〜900・高さ 100〜300)だけを決めている。図は 390×190 の比率</text>
</svg>
