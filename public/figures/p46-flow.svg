<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>確認申請から検査済証までの流れ</title>

  <text x="20" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">DIAGRAM — 手続の流れ</text>

  <!-- 主経路(アクセント) -->
  <g stroke="#2E7D6B" stroke-width="1.5" fill="none">
    <line x1="130" y1="72" x2="166" y2="72"/><path d="M160 67 L168 72 L160 77"/>
    <line x1="390" y1="72" x2="426" y2="72"/><path d="M420 67 L428 72 L420 77"/>
    <line x1="530" y1="72" x2="566" y2="72"/><path d="M560 67 L568 72 L560 77"/>
    <polyline points="635,94 635,220 85,220 85,232"/><path d="M80 226 L85 234 L90 226"/>
    <line x1="150" y1="258" x2="196" y2="258"/><path d="M190 253 L198 258 L190 263"/>
    <line x1="330" y1="258" x2="376" y2="258"/><path d="M370 253 L378 258 L370 263"/>
    <line x1="490" y1="258" x2="536" y2="258"/><path d="M530 253 L538 258 L530 263"/>
  </g>

  <!-- 箱 -->
  <g fill="none" stroke="#141414" stroke-width="1">
    <rect x="20" y="50" width="110" height="44"/>
    <rect x="170" y="50" width="220" height="44"/>
    <rect x="430" y="50" width="100" height="44"/>
    <rect x="570" y="50" width="130" height="44"/>
    <rect x="150" y="128" width="125" height="44"/>
    <rect x="285" y="128" width="125" height="44"/>
    <rect x="20" y="236" width="130" height="44"/>
    <rect x="200" y="236" width="130" height="44"/>
    <rect x="380" y="236" width="110" height="44"/>
    <rect x="540" y="236" width="160" height="44"/>
  </g>
  <g font-size="12" fill="#141414" text-anchor="middle">
    <text x="75" y="68">確認申請</text>
    <text x="280" y="68">確認審査</text>
    <text x="480" y="68">確認済証</text>
    <text x="635" y="68">着工</text>
    <text x="212" y="146" font-size="11">構造計算適合性判定</text>
    <text x="347" y="146" font-size="11">省エネ適合性判定</text>
    <text x="85" y="254">中間検査</text>
    <text x="265" y="254">完了検査</text>
    <text x="435" y="254">検査済証</text>
    <text x="620" y="254">使用開始</text>
  </g>
  <g font-size="10" fill="#5c5c5a" text-anchor="middle">
    <text x="75" y="86">法6条・6条の2</text>
    <text x="280" y="86">建築主事等 35日以内(3号は7日)</text>
    <text x="480" y="86">法6条4項</text>
    <text x="635" y="86">交付後(法6条8項)</text>
    <text x="212" y="163">14日以内(延長35日)</text>
    <text x="347" y="163">14日以内(延長28日)</text>
    <text x="85" y="272">法7条の3</text>
    <text x="265" y="272">法7条・7条の2</text>
    <text x="435" y="272">法7条5項</text>
    <text x="620" y="272">交付まで原則使用不可</text>
  </g>

  <!-- 適判 → 確認 -->
  <g stroke="#141414" stroke-width="0.8" fill="none">
    <line x1="212" y1="128" x2="212" y2="98"/><path d="M208 104 L212 96 L216 104"/>
    <line x1="347" y1="128" x2="347" y2="98"/><path d="M343 104 L347 96 L351 104"/>
  </g>
  <text x="420" y="146" font-size="10.5" fill="#141414">適合判定通知書を確認側へ提出</text>
  <text x="420" y="162" font-size="10.5" fill="#5c5c5a">建築主事等へは審査期間末日の3日前まで</text>
  <!-- 建築主が適判を申請 -->
  <polyline points="75,94 75,186 347,186 347,172" fill="none" stroke="#9a9a96" stroke-width="0.8"/>
  <line x1="212" y1="186" x2="212" y2="172" stroke="#9a9a96" stroke-width="0.8"/>
  <text x="90" y="204" font-size="10.5" fill="#5c5c5a">適判は建築主が別に申請(法6条の3・建築物省エネ法11条)</text>

  <!-- 期間 -->
  <text x="20" y="300" font-size="10.5" fill="#5c5c5a">特定工程後4日以内に申請</text>
  <text x="20" y="316" font-size="10.5" fill="#5c5c5a">受理から4日以内に検査</text>
  <text x="200" y="300" font-size="10.5" fill="#5c5c5a">完了から4日以内に申請</text>
  <text x="200" y="316" font-size="10.5" fill="#5c5c5a">受理から7日以内に検査</text>
  <text x="540" y="300" font-size="10.5" fill="#5c5c5a">仮使用の認定などの例外あり</text>
  <text x="540" y="316" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#9a9a96">法7条の6(1号・2号の新築等)</text>
</svg>
