<svg xmlns="http://www.w3.org/2000/svg" fill="#141414" viewBox="0 0 720 280" width="720" height="280" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>幹線と分岐回路の電圧降下の配分</title>
  <style>
    text{font-size:11px}
    .s{font-size:10.5px;fill:#5c5c5a}
    .m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px}
    .t{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:1.2px;fill:#9a9a96}
    .a{fill:#2E7D6B}
    .k{stroke:#141414;stroke-width:1;fill:none}
    .g{stroke:#9a9a96;stroke-width:.8;fill:none}
    .c{stroke:#2E7D6B;stroke-width:1.2;fill:none}
    .h{stroke:#e6e6e2;stroke-width:1}
  </style>
  <defs>
    <marker id="ta" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 7 L7 1" stroke="#2E7D6B" stroke-width="1.2"/></marker>
  </defs>

  <text x="20" y="24" class="t">DIAGRAM — 電圧降下の配分</text>

  <!-- 行 1:低圧受電 -->
  <text x="20" y="70">低圧で受電</text>
  <text x="20" y="86" class="s">電気事業者から</text>
  <text x="160" y="54" class="s" text-anchor="middle">引込口</text>
  <rect x="156" y="62" width="8" height="8" fill="#141414"/>
  <line x1="164" y1="66" x2="390" y2="66" class="k"/>
  <rect x="390" y="56" width="30" height="20" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <text x="405" y="50" class="s" text-anchor="middle">分電盤</text>
  <line x1="420" y1="66" x2="648" y2="66" class="k"/>
  <circle cx="656" cy="66" r="8" class="k"/>
  <path class="k" d="M650.3 60.3 L661.7 71.7 M650.3 71.7 L661.7 60.3"/>
  <text x="656" y="50" class="s" text-anchor="middle">負荷</text>
  <line x1="160" y1="90" x2="405" y2="90" class="c" marker-start="url(#ta)" marker-end="url(#ta)"/>
  <line x1="405" y1="90" x2="656" y2="90" class="c" marker-start="url(#ta)" marker-end="url(#ta)"/>
  <text x="282" y="108" class="a" text-anchor="middle">幹線 2% 以下</text>
  <text x="530" y="108" class="a" text-anchor="middle">分岐回路 2% 以下</text>

  <!-- 行 2:構内変圧器 -->
  <text x="20" y="160">構内の変圧器</text>
  <text x="20" y="176" class="s">から供給</text>
  <text x="160" y="140" class="s" text-anchor="middle">変圧器</text>
  <circle cx="153" cy="156" r="8" class="k"/><circle cx="165" cy="156" r="8" class="k"/>
  <line x1="173" y1="156" x2="390" y2="156" class="k"/>
  <rect x="390" y="146" width="30" height="20" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <line x1="420" y1="156" x2="648" y2="156" class="k"/>
  <circle cx="656" cy="156" r="8" class="k"/>
  <path class="k" d="M650.3 150.3 L661.7 161.7 M650.3 161.7 L661.7 150.3"/>
  <line x1="160" y1="180" x2="405" y2="180" class="c" marker-start="url(#ta)" marker-end="url(#ta)"/>
  <line x1="405" y1="180" x2="656" y2="180" class="c" marker-start="url(#ta)" marker-end="url(#ta)"/>
  <text x="282" y="198" class="a" text-anchor="middle">幹線 3% 以下</text>
  <text x="530" y="198" class="a" text-anchor="middle">分岐回路 2% 以下</text>

  <!-- 略算式 -->
  <line x1="20" y1="216" x2="700" y2="216" class="h"/>
  <text x="20" y="236" class="m" fill="#5c5c5a"><tspan fill="#9a9a96">略算式</tspan><tspan dx="12">単相2線 e=35.6LI/1000A</tspan><tspan dx="16">三相3線 e=30.8LI/1000A</tspan><tspan dx="16">単相3線 e=17.8LI/1000A(外側線−中性線)</tspan></text>
  <text x="20" y="256" class="s">e 電圧降下[V]・L こう長[m]・I 電流[A]・A 断面積[mm²]。こう長が長い場合の緩和は内線規程 1310 節の表による。</text>
</svg>
