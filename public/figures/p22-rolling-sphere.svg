<svg xmlns="http://www.w3.org/2000/svg" fill="#141414" viewBox="0 0 720 360" width="720" height="360" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>回転球体法と保護レベル別の寸法</title>
  <style>
    text{font-size:11px}
    .s{font-size:10.5px;fill:#5c5c5a}
    .m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px}
    .t{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:1.2px;fill:#9a9a96}
    .a{fill:#2E7D6B}
    .k{stroke:#141414;stroke-width:1;fill:none}
    .g{stroke:#9a9a96;stroke-width:.8;fill:none}
    .c{stroke:#2E7D6B;stroke-width:1.2;fill:none}
    .h{stroke:#e6e6e2;stroke-width:1}
  </style>
  <defs>
    <pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a96" stroke-width="0.6"/></pattern>
  </defs>

  <text x="20" y="24" class="t">SECTION — 回転球体法</text>

  <!-- 保護範囲 -->
  <path d="M200 220 V300 H120 A80 80 0 0 0 200 220 Z M360 220 V300 H440 A80 80 0 0 1 360 220 Z" fill="#eef6f3"/>

  <!-- 地盤・建築物 -->
  <rect x="20" y="300" width="500" height="6" fill="url(#hp)"/>
  <line x1="20" y1="300" x2="520" y2="300" class="k"/>
  <rect x="200" y="220" width="160" height="80" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <text x="280" y="266" text-anchor="middle">建築物</text>

  <!-- 球 -->
  <circle cx="120" cy="220" r="80" class="c"/>
  <circle cx="280" cy="140" r="80" class="c"/>
  <circle cx="440" cy="220" r="80" class="c"/>
  <line x1="280" y1="140" x2="223.4" y2="83.4" class="c" stroke-width="0.8"/>
  <circle cx="280" cy="140" r="1.6" fill="#2E7D6B"/>
  <text x="244" y="104" class="a">R</text>

  <!-- 受雷点 -->
  <g fill="#141414"><circle cx="200" cy="220" r="3.5"/><circle cx="360" cy="220" r="3.5"/><circle cx="280" cy="220" r="3.5"/></g>

  <!-- 凡例 -->
  <circle cx="553" cy="268" r="3.5" fill="#141414"/>
  <text x="564" y="272" class="s">球が触れる点</text>
  <rect x="548" y="282" width="10" height="10" fill="#eef6f3"/>
  <text x="564" y="292" class="s">保護範囲</text>

  <!-- 表 -->
  <text x="548" y="64" class="s">LPL</text>
  <text x="604" y="64" class="s" text-anchor="end">R</text>
  <text x="652" y="64" class="s" text-anchor="end">メッシュ</text>
  <text x="700" y="64" class="s" text-anchor="end">引下げ</text>
  <line x1="548" y1="72" x2="700" y2="72" class="h"/>
  <g class="m">
    <text x="548" y="92">I</text><text x="604" y="92" text-anchor="end">20m</text><text x="652" y="92" text-anchor="end">5m</text><text x="700" y="92" text-anchor="end">10m</text>
    <text x="548" y="112">II</text><text x="604" y="112" text-anchor="end">30m</text><text x="652" y="112" text-anchor="end">10m</text><text x="700" y="112" text-anchor="end">10m</text>
    <text x="548" y="132">III</text><text x="604" y="132" text-anchor="end">45m</text><text x="652" y="132" text-anchor="end">15m</text><text x="700" y="132" text-anchor="end">15m</text>
    <text x="548" y="152" class="a">IV</text><text x="604" y="152" class="a" text-anchor="end">60m</text><text x="652" y="152" class="a" text-anchor="end">20m</text><text x="700" y="152" class="a" text-anchor="end">20m</text>
  </g>
  <line x1="548" y1="162" x2="700" y2="162" class="h"/>
  <text x="548" y="182" class="s">JIS Z 9290-3:2019</text>
  <text x="548" y="198" class="s">メッシュは網目の寸法、</text>
  <text x="548" y="214" class="s">引下げは引下げ導線の</text>
  <text x="548" y="230" class="s">平均間隔。一般建築物は</text>
  <text x="548" y="246" class="s">LPL IV(国住指第532号)</text>

  <line x1="20" y1="318" x2="700" y2="318" class="h"/>
  <text x="20" y="336" class="s">半径 R の球を転がし、球が触れる点(突角部・縁部・屋根面)に受雷部を置く。球が入らない範囲が保護範囲。</text>
  <text x="20" y="352" class="s">高さ 20m を超える建築物は避雷設備を設ける(建築基準法第33条)。2025 年 4 月から JIS Z 9290-3 の外部雷保護システムによる。</text>
</svg>
