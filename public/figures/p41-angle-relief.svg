<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>外壁の角度による延焼のおそれのある部分の緩和</title>

  <text x="20" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">DIAGRAM — 角度 θ と距離 d</text>
  <text x="450" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">PLAN — θ=60° の例</text>
  <line x1="432" y1="16" x2="432" y2="276" stroke="#e6e6e2" stroke-width="1"/>

  <text x="110" y="50" font-size="12" fill="#141414">d = max{ D, A(1 − 0.000068θ²) }</text>

  <!-- 軸 -->
  <line x1="70" y1="60" x2="70" y2="240" stroke="#141414" stroke-width="1"/>
  <line x1="70" y1="240" x2="404" y2="240" stroke="#141414" stroke-width="1"/>
  <g stroke="#e6e6e2" stroke-width="1">
    <line x1="70" y1="77.1" x2="400" y2="77.1"/>
    <line x1="70" y1="131.4" x2="400" y2="131.4"/>
    <line x1="70" y1="185.7" x2="400" y2="185.7"/>
    <line x1="70" y1="212.9" x2="400" y2="212.9"/>
  </g>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#141414" text-anchor="end">
    <text x="62" y="81">5.0</text>
    <text x="62" y="135">4.0</text>
    <text x="62" y="189">3.0</text>
    <text x="62" y="216">2.5</text>
    <text x="62" y="70" fill="#5c5c5a">d[m]</text>
  </g>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#141414" text-anchor="middle">
    <text x="70" y="256">0</text><text x="125" y="256">15</text><text x="180" y="256">30</text><text x="235" y="256">45</text>
    <text x="290" y="256">60</text><text x="345" y="256">75</text><text x="400" y="256">90</text>
  </g>
  <text x="404" y="274" font-size="10.5" fill="#5c5c5a" text-anchor="end">θ 外壁面と隣地境界線等のなす角度 [°]</text>

  <!-- 曲線 -->
  <polyline fill="none" stroke="#2E7D6B" stroke-width="1.5" points="70.0,77.1 79.2,77.2 88.3,77.6 97.5,78.2 106.7,79.0 115.8,80.0 125.0,81.3 134.2,82.8 143.3,84.5 152.5,86.5 161.7,88.7 170.8,91.1 180.0,93.7 189.2,96.6 198.3,99.7 207.5,103.1 216.7,106.7 225.8,110.5 235.0,114.5 244.2,118.8 253.3,123.3 262.5,128.0 268.9,131.4 400.0,131.4"/>
  <polyline fill="none" stroke="#141414" stroke-width="1" points="70.0,185.7 79.2,185.8 88.3,186.0 97.5,186.3 106.7,186.8 115.8,187.4 125.0,188.2 134.2,189.1 143.3,190.1 152.5,191.3 161.7,192.6 170.8,194.1 180.0,195.7 189.2,197.4 198.3,199.3 207.5,201.3 216.7,203.4 225.8,205.7 235.0,208.1 244.2,210.7 251.5,212.9 400.0,212.9"/>
  <circle cx="235" cy="114.5" r="2.5" fill="#2E7D6B"/>
  <circle cx="235" cy="208.1" r="2.5" fill="#141414"/>
  <text x="240" y="106" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#2E7D6B">4.31</text>
  <text x="240" y="200" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#141414">2.59</text>
  <text x="290" y="124" font-size="10.5" fill="#2E7D6B">2階以上 A=5・D=4</text>
  <text x="290" y="205" font-size="10.5" fill="#141414">1階 A=3・D=2.5</text>

  <!-- 平面(θ=60°、24px/m) -->
  <line x1="450" y1="230" x2="700" y2="230" stroke="#9a9a96" stroke-width="1"/>
  <text x="700" y="248" font-size="10.5" fill="#5c5c5a" text-anchor="end">隣地境界線等</text>
  <polygon points="540,215 600,111 548,81 488,185" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <line x1="540" y1="215" x2="531.3" y2="230" stroke="#9a9a96" stroke-width="0.8" stroke-dasharray="3 3"/>
  <path d="M561.3 230 A30 30 0 0 0 546.3 204" fill="none" stroke="#141414" stroke-width="0.8"/>
  <text x="566" y="218" font-size="11" fill="#141414">θ</text>
  <line x1="450" y1="110" x2="700" y2="110" stroke="#9a9a96" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="450" y1="134" x2="700" y2="134" stroke="#2E7D6B" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="700" y="104" font-size="10.5" fill="#5c5c5a" text-anchor="end">原則 5m</text>
  <text x="700" y="150" font-size="10.5" fill="#2E7D6B" text-anchor="end">d = 4m</text>
  <text x="450" y="268" font-size="10.5" fill="#5c5c5a">2階以上の例。d 以内の部分だけが対象</text>
</svg>
