<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>延焼のおそれのある部分の範囲</title>
  <defs>
    <marker id="tka" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 7 L7 1" stroke="#2E7D6B" stroke-width="1.2"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a96" stroke-width="0.6"/></pattern>
  </defs>

  <text x="20" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">SECTION — 断面</text>
  <text x="400" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">PLAN — 平面</text>
  <line x1="362" y1="16" x2="362" y2="270" stroke="#e6e6e2" stroke-width="1"/>

  <!-- 断面 -->
  <line x1="20" y1="250" x2="340" y2="250" stroke="#9a9a96" stroke-width="1"/>
  <rect x="20" y="250" width="320" height="8" fill="url(#hatch)"/>
  <line x1="50" y1="58" x2="50" y2="250" stroke="#9a9a96" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="50" y="50" font-size="10.5" fill="#5c5c5a" text-anchor="middle">隣地境界線</text>
  <!-- 延焼のおそれのある部分 -->
  <rect x="80" y="200" width="24" height="50" fill="#eef6f3"/>
  <rect x="80" y="100" width="60" height="100" fill="#eef6f3"/>
  <line x1="104" y1="200" x2="104" y2="250" stroke="#9a9a96" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="140" y1="100" x2="140" y2="200" stroke="#9a9a96" stroke-width="0.8" stroke-dasharray="3 3"/>
  <!-- 建物 -->
  <g fill="none" stroke="#141414" stroke-width="1">
    <rect x="80" y="100" width="220" height="150"/>
    <line x1="80" y1="150" x2="300" y2="150"/>
    <line x1="80" y1="200" x2="300" y2="200"/>
  </g>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#9a9a96">
    <text x="292" y="243" text-anchor="end">1F</text>
    <text x="292" y="193" text-anchor="end">2F</text>
    <text x="292" y="143" text-anchor="end">3F</text>
  </g>
  <!-- 引き出し -->
  <line x1="94" y1="226" x2="150" y2="226" stroke="#141414" stroke-width="0.6"/>
  <rect x="150" y="224" width="4" height="4" fill="#141414"/>
  <text x="160" y="230" font-size="11" fill="#141414">1階は 3m 以下</text>
  <line x1="120" y1="176" x2="150" y2="176" stroke="#141414" stroke-width="0.6"/>
  <rect x="150" y="174" width="4" height="4" fill="#141414"/>
  <text x="160" y="180" font-size="11" fill="#141414">2階以上は 5m 以下</text>
  <!-- 寸法 -->
  <line x1="50" y1="272" x2="104" y2="272" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <text x="112" y="276" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#2E7D6B">3m</text>
  <line x1="50" y1="290" x2="140" y2="290" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <text x="148" y="294" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#2E7D6B">5m</text>

  <!-- 平面 -->
  <rect x="420" y="60" width="260" height="160" fill="none" stroke="#9a9a96" stroke-width="0.8"/>
  <text x="550" y="52" font-size="10.5" fill="#5c5c5a" text-anchor="middle">隣地境界線</text>
  <line x1="400" y1="260" x2="700" y2="260" stroke="#9a9a96" stroke-width="0.8"/>
  <line x1="400" y1="240" x2="700" y2="240" stroke="#9a9a96" stroke-width="0.8" stroke-dasharray="8 3 2 3"/>
  <text x="696" y="235" font-size="10.5" fill="#5c5c5a" text-anchor="end">道路中心線</text>
  <text x="430" y="235" font-size="10.5" fill="#5c5c5a">道路</text>
  <rect x="440" y="80" width="160" height="120" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <rect x="450" y="90" width="200" height="120" fill="none" stroke="#9a9a96" stroke-width="0.8" stroke-dasharray="3 3"/>
  <rect x="470" y="110" width="160" height="80" fill="none" stroke="#2E7D6B" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="535" y="154" font-size="10.5" fill="#5c5c5a" text-anchor="middle">各線より境界側が</text>
  <text x="535" y="170" font-size="10.5" fill="#5c5c5a" text-anchor="middle">延焼のおそれのある部分</text>

  <!-- 凡例 -->
  <line x1="420" y1="284" x2="446" y2="284" stroke="#9a9a96" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="452" y="288" font-size="10.5" fill="#5c5c5a">1階 3m</text>
  <line x1="520" y1="284" x2="546" y2="284" stroke="#2E7D6B" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="552" y="288" font-size="10.5" fill="#5c5c5a">2階以上 5m</text>

  <line x1="20" y1="300" x2="700" y2="300" stroke="#e6e6e2" stroke-width="1"/>
  <text x="20" y="316" font-size="10.5" fill="#5c5c5a">基準線は隣地境界線・道路中心線・同一敷地内の建築物相互の外壁間の中心線(法2条6号)</text>
</svg>
