<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>防火区画の4つの種類(令112条)</title>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a96" stroke-width="0.6"/></pattern>
  </defs>

  <text x="20" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">SECTION — 断面(模式)</text>
  <text x="430" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">令112条</text>
  <line x1="412" y1="16" x2="412" y2="304" stroke="#e6e6e2" stroke-width="1"/>

  <!-- 地盤 -->
  <line x1="20" y1="290" x2="400" y2="290" stroke="#9a9a96" stroke-width="1"/>
  <rect x="20" y="290" width="380" height="8" fill="url(#hatch)"/>

  <!-- 建物(下層 1〜4F / 上層 11・12F) -->
  <g fill="none" stroke="#141414" stroke-width="1">
    <rect x="40" y="186" width="340" height="104"/>
    <line x1="40" y1="238" x2="380" y2="238"/>
    <line x1="40" y1="212" x2="380" y2="212"/>
    <rect x="40" y="62" width="340" height="104"/>
    <line x1="40" y1="88" x2="380" y2="88"/>
    <line x1="40" y1="114" x2="380" y2="114"/>
    <line x1="40" y1="140" x2="380" y2="140"/>
  </g>
  <line x1="40" y1="264" x2="310" y2="264" stroke="#141414" stroke-width="1"/>
  <text x="170" y="181" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#9a9a96" text-anchor="middle">5F〜10F 省略</text>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#9a9a96">
    <text x="46" y="282">1F</text><text x="46" y="256">2F</text><text x="46" y="230">3F</text><text x="46" y="204">4F</text>
    <text x="46" y="158">11F</text><text x="46" y="132">12F</text><text x="46" y="106">13F</text><text x="46" y="80">14F</text>
  </g>
  <text x="120" y="282" font-size="10.5" fill="#5c5c5a">店舗</text>
  <text x="120" y="256" font-size="10.5" fill="#5c5c5a">共同住宅</text>

  <!-- 区画(アクセント) -->
  <g stroke="#2E7D6B" stroke-width="1.5" fill="none">
    <!-- 01 面積区画 -->
    <line x1="210" y1="186" x2="210" y2="264"/>
    <!-- 02 高層区画 -->
    <line x1="120" y1="62" x2="120" y2="166"/>
    <line x1="200" y1="62" x2="200" y2="166"/>
    <!-- 03 竪穴区画 -->
    <line x1="310" y1="186" x2="310" y2="290"/>
    <line x1="350" y1="186" x2="350" y2="290"/>
    <line x1="310" y1="62" x2="310" y2="166"/>
    <line x1="350" y1="62" x2="350" y2="166"/>
    <!-- 04 異種用途区画 -->
    <line x1="40" y1="264" x2="310" y2="264"/>
  </g>
  <g stroke="#2E7D6B" stroke-width="0.8" stroke-dasharray="3 3">
    <line x1="310" y1="166" x2="310" y2="186"/>
    <line x1="350" y1="166" x2="350" y2="186"/>
  </g>
  <!-- 階段の段(竪穴内) -->
  <g stroke="#9a9a96" stroke-width="0.6">
    <line x1="312" y1="284" x2="348" y2="268"/>
    <line x1="312" y1="258" x2="348" y2="242"/>
    <line x1="312" y1="232" x2="348" y2="216"/>
    <line x1="312" y1="206" x2="348" y2="190"/>
    <line x1="312" y1="160" x2="348" y2="144"/>
    <line x1="312" y1="134" x2="348" y2="118"/>
    <line x1="312" y1="108" x2="348" y2="92"/>
    <line x1="312" y1="82" x2="348" y2="66"/>
  </g>

  <!-- 番号 -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#2E7D6B">
    <text x="216" y="229">01</text>
    <text x="126" y="105">02</text>
    <text x="206" y="105">02</text>
    <text x="358" y="52">03</text>
    <text x="250" y="260">04</text>
  </g>

  <!-- 説明 -->
  <g font-size="12" fill="#141414">
    <text x="430" y="58"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#2E7D6B">01</tspan>  面積区画 <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#9a9a96">1項・4項・5項</tspan></text>
    <text x="430" y="122"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#2E7D6B">02</tspan>  高層区画 <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#9a9a96">7〜10項</tspan></text>
    <text x="430" y="186"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#2E7D6B">03</tspan>  竪穴区画 <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#9a9a96">11〜15項</tspan></text>
    <text x="430" y="250"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#2E7D6B">04</tspan>  異種用途区画 <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#9a9a96">18項</tspan></text>
  </g>
  <g font-size="10.5" fill="#5c5c5a">
    <text x="452" y="78">1,500m² 以内ごと(1項)</text>
    <text x="452" y="94">準耐火とした建築物等は 500m²・1,000m²</text>
    <text x="452" y="142">11階以上は 100m² 以内ごと</text>
    <text x="452" y="158">内装を準不燃で 200m²、不燃で 500m²</text>
    <text x="452" y="206">階段・吹抜け・昇降路などの縦の空間を</text>
    <text x="452" y="222">他の部分と区画</text>
    <text x="452" y="270">法27条に当たる用途の部分と</text>
    <text x="452" y="286">その他の部分を区画</text>
  </g>
</svg>
