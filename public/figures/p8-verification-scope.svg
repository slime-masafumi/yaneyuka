<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>避難安全検証法の検証範囲</title>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a96" stroke-width="0.6"/></pattern>
  </defs>

  <text x="20" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">SECTION — 検証する範囲</text>

  <!-- 区画 -->
  <g transform="translate(20,0)">
    <rect x="80" y="104" width="64" height="30" fill="#eef6f3" stroke="#2E7D6B" stroke-width="1.2"/>
    <g fill="none" stroke="#141414" stroke-width="1">
      <rect x="40" y="44" width="160" height="120"/>
      <line x1="40" y1="74" x2="200" y2="74"/><line x1="40" y1="104" x2="200" y2="104"/><line x1="40" y1="134" x2="200" y2="134"/>
    </g>
    <line x1="30" y1="164" x2="210" y2="164" stroke="#9a9a96" stroke-width="1"/>
    <rect x="30" y="164" width="180" height="6" fill="url(#hatch)"/>
    <text x="0" y="194" font-size="12" fill="#141414">区画避難安全検証</text>
    <text x="0" y="210" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#9a9a96">令128条の7</text>
    <text x="0" y="230" font-size="10.5" fill="#5c5c5a">区画部分ごと。排煙・内装など</text>
    <text x="0" y="246" font-size="10.5" fill="#5c5c5a">の規定の一部を適用しない</text>
  </g>

  <!-- 階 -->
  <g transform="translate(260,0)">
    <rect x="40" y="104" width="160" height="30" fill="#eef6f3" stroke="#2E7D6B" stroke-width="1.2"/>
    <g fill="none" stroke="#141414" stroke-width="1">
      <rect x="40" y="44" width="160" height="120"/>
      <line x1="40" y1="74" x2="200" y2="74"/><line x1="40" y1="104" x2="200" y2="104"/><line x1="40" y1="134" x2="200" y2="134"/>
    </g>
    <line x1="30" y1="164" x2="210" y2="164" stroke="#9a9a96" stroke-width="1"/>
    <rect x="30" y="164" width="180" height="6" fill="url(#hatch)"/>
    <text x="0" y="194" font-size="12" fill="#141414">階避難安全検証</text>
    <text x="0" y="210" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#9a9a96">令129条</text>
    <text x="0" y="230" font-size="10.5" fill="#5c5c5a">階ごと。歩行距離・排煙・内装</text>
    <text x="0" y="246" font-size="10.5" fill="#5c5c5a">などの規定の一部を適用しない</text>
  </g>

  <!-- 全館 -->
  <g transform="translate(500,0)">
    <rect x="40" y="44" width="160" height="120" fill="#eef6f3" stroke="#2E7D6B" stroke-width="1.2"/>
    <g fill="none" stroke="#141414" stroke-width="1">
      <line x1="40" y1="74" x2="200" y2="74"/><line x1="40" y1="104" x2="200" y2="104"/><line x1="40" y1="134" x2="200" y2="134"/>
    </g>
    <line x1="30" y1="164" x2="210" y2="164" stroke="#9a9a96" stroke-width="1"/>
    <rect x="30" y="164" width="180" height="6" fill="url(#hatch)"/>
    <text x="0" y="194" font-size="12" fill="#141414">全館避難安全検証</text>
    <text x="0" y="210" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#9a9a96">令129条の2</text>
    <text x="0" y="230" font-size="10.5" fill="#5c5c5a">建築物全体。竪穴区画などを</text>
    <text x="0" y="246" font-size="10.5" fill="#5c5c5a">含む規定の一部を適用しない</text>
  </g>
</svg>
