<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>用途別の天井高さの目安と法的下限</title>

  <text x="20" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">CHART — 用途別の天井高さ [m]</text>

  <!-- 目盛り y = 250 − (h − 2.0) × 90 -->
  <g stroke="#e6e6e2" stroke-width="1">
    <line x1="80" y1="205" x2="640" y2="205"/><line x1="80" y1="160" x2="640" y2="160"/>
    <line x1="80" y1="115" x2="640" y2="115"/><line x1="80" y1="70" x2="640" y2="70"/>
  </g>
  <line x1="80" y1="250" x2="640" y2="250" stroke="#141414" stroke-width="1"/>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#9a9a96" text-anchor="end">
    <text x="72" y="253">2.0</text><text x="72" y="208">2.5</text><text x="72" y="163">3.0</text>
    <text x="72" y="118">3.5</text><text x="72" y="73">4.0</text>
  </g>

  <!-- 法的下限 2.1m -->
  <line x1="80" y1="241" x2="640" y2="241" stroke="#2E7D6B" stroke-width="1.2"/>
  <text x="648" y="236" font-size="10.5" fill="#2E7D6B">法的下限</text>
  <text x="648" y="250" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#2E7D6B">2.1</text>

  <!-- 帯:ハイグレード・トレンド -->
  <g fill="#f5f5f2" stroke="#141414" stroke-width="0.8">
    <rect x="133" y="160" width="14" height="45"/>
    <rect x="243" y="160" width="14" height="18"/>
  </g>
  <g stroke="#141414" stroke-width="1"><line x1="352" y1="70" x2="368" y2="70"/><line x1="462" y1="160" x2="478" y2="160"/></g>
  <!-- 商業:4.0 以上 -->
  <line x1="360" y1="70" x2="360" y2="44" stroke="#141414" stroke-width="0.8" stroke-dasharray="3 3"/>
  <path d="M355 50 L360 42 L365 50" fill="none" stroke="#141414" stroke-width="0.8"/>
  <!-- ホテル:3.0 以上 -->
  <line x1="470" y1="160" x2="470" y2="134" stroke="#141414" stroke-width="0.8" stroke-dasharray="3 3"/>
  <path d="M465 140 L470 132 L475 140" fill="none" stroke="#141414" stroke-width="0.8"/>

  <!-- 一般的標準 ■ -->
  <g fill="#141414">
    <rect x="135" y="211" width="10" height="6"/>
    <rect x="245" y="193" width="10" height="6"/>
    <rect x="355" y="157" width="10" height="6"/>
    <rect x="465" y="202" width="10" height="6"/>
    <rect x="575" y="157" width="10" height="6"/>
  </g>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#141414" text-anchor="end">
    <text x="128" y="218">2.4</text><text x="238" y="200">2.6</text><text x="348" y="164">3.0</text>
    <text x="458" y="209">2.5</text><text x="568" y="164">3.0</text>
  </g>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#5c5c5a">
    <text x="152" y="164">2.5–3.0</text><text x="262" y="164">2.8–3.0</text><text x="372" y="48">4.0 以上</text>
    <text x="482" y="140">3.0 以上</text>
  </g>

  <!-- 用途名 -->
  <g font-size="11" fill="#141414" text-anchor="middle">
    <text x="140" y="272">住宅</text><text x="250" y="272">オフィス</text><text x="360" y="272">商業</text>
    <text x="470" y="272">ホテル</text><text x="580" y="272">学校(教室)</text>
  </g>
  <text x="20" y="292" font-size="10.5" fill="#5c5c5a">■ 一般的標準 / 帯・破線 ハイグレード・トレンド(目安)。法的下限は居室のみ(令21条)</text>
</svg>
