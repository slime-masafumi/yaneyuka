<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>椅子と机の座面高さ・天板高さ・差尺</title>
  <defs>
    <marker id="tk" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 7 L7 1" stroke="#141414" stroke-width="1"/></marker>
    <marker id="tka" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 7 L7 1" stroke="#2E7D6B" stroke-width="1.2"/></marker>
  </defs>

  <text x="20" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">SECTION — 断面</text>

  <!-- 床 -->
  <line x1="20" y1="250" x2="700" y2="250" stroke="#9a9a96" stroke-width="1"/>

  <!-- 椅子:座面 SH 440 → y=140 -->
  <rect x="140" y="140" width="92" height="7" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <line x1="146" y1="147" x2="146" y2="250" stroke="#141414" stroke-width="1"/>
  <line x1="226" y1="147" x2="226" y2="250" stroke="#141414" stroke-width="1"/>
  <line x1="142" y1="140" x2="132" y2="66" stroke="#141414" stroke-width="1"/>
  <line x1="136" y1="96" x2="128" y2="66" stroke="#141414" stroke-width="0.6"/>

  <!-- 机:天板 TH 720 → y=70 -->
  <rect x="250" y="70" width="210" height="6" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <line x1="262" y1="76" x2="262" y2="250" stroke="#141414" stroke-width="1"/>
  <line x1="448" y1="76" x2="448" y2="250" stroke="#141414" stroke-width="1"/>

  <!-- SH -->
  <line x1="236" y1="140" x2="104" y2="140" stroke="#9a9a96" stroke-width="0.6" stroke-dasharray="3 3"/>
  <line x1="110" y1="250" x2="110" y2="140" stroke="#141414" stroke-width="0.6" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="100" y="192" font-size="12" fill="#141414" text-anchor="end">SH</text>
  <text x="100" y="207" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#5c5c5a" text-anchor="end">420–460</text>
  <text x="100" y="222" font-size="10.5" fill="#5c5c5a" text-anchor="end">座面高さ</text>

  <!-- 差尺 -->
  <line x1="236" y1="140" x2="496" y2="140" stroke="#2E7D6B" stroke-width="0.6" stroke-dasharray="3 3"/>
  <line x1="460" y1="70" x2="496" y2="70" stroke="#2E7D6B" stroke-width="0.6"/>
  <line x1="490" y1="140" x2="490" y2="70" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <text x="500" y="100" font-size="12" fill="#2E7D6B">差尺</text>
  <text x="500" y="115" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#2E7D6B">250–300</text>

  <!-- TH -->
  <line x1="496" y1="70" x2="606" y2="70" stroke="#9a9a96" stroke-width="0.6" stroke-dasharray="3 3"/>
  <line x1="600" y1="250" x2="600" y2="70" stroke="#141414" stroke-width="0.6" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="610" y="152" font-size="12" fill="#141414">TH</text>
  <text x="610" y="167" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#5c5c5a">700–720</text>
  <text x="610" y="182" font-size="10.5" fill="#5c5c5a">天板高さ</text>

  <!-- 注記 -->
  <text x="20" y="276" font-size="10.5" fill="#5c5c5a">寸法は目安 [mm]。カウンターは TH 950–1050・SH 650–750。JIS S 1031 附属書B(参考)は TH 700 又は 720 を例示</text>
</svg>
