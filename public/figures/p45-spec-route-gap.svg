<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>特定天井の仕様ルート(隙間あり)の要点</title>
  <defs>
    <marker id="tka" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 7 L7 1" stroke="#2E7D6B" stroke-width="1.2"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a96" stroke-width="0.6"/></pattern>
  </defs>

  <text x="20" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">SECTION — 仕様ルート(隙間あり)</text>
  <line x1="490" y1="16" x2="490" y2="250" stroke="#e6e6e2" stroke-width="1"/>

  <!-- 躯体 -->
  <rect x="40" y="40" width="430" height="10" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <rect x="462" y="50" width="8" height="190" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>

  <!-- 吊りボルト -->
  <g stroke="#141414" stroke-width="1">
    <line x1="90" y1="50" x2="90" y2="172"/><line x1="160" y1="50" x2="160" y2="172"/>
    <line x1="300" y1="50" x2="300" y2="172"/><line x1="380" y1="50" x2="380" y2="172"/><line x1="440" y1="50" x2="440" y2="172"/>
  </g>
  <!-- 斜め部材 V 字 -->
  <g stroke="#141414" stroke-width="1.4">
    <line x1="226" y1="172" x2="180" y2="50"/><line x1="234" y1="172" x2="280" y2="50"/>
  </g>
  <!-- 野縁受け・野縁・天井板 -->
  <line x1="60" y1="172" x2="446" y2="172" stroke="#141414" stroke-width="1"/>
  <g fill="#141414"><rect x="72" y="174" width="4" height="4"/><rect x="132" y="174" width="4" height="4"/><rect x="192" y="174" width="4" height="4"/>
    <rect x="252" y="174" width="4" height="4"/><rect x="312" y="174" width="4" height="4"/><rect x="372" y="174" width="4" height="4"/><rect x="432" y="174" width="4" height="4"/></g>
  <rect x="60" y="178" width="386" height="5" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>

  <!-- 吊り長さ -->
  <line x1="56" y1="172" x2="86" y2="172" stroke="#2E7D6B" stroke-width="0.6"/>
  <line x1="62" y1="50" x2="62" y2="172" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <text x="56" y="106" font-size="11" fill="#2E7D6B" text-anchor="end">吊り長さ</text>
  <text x="56" y="121" font-size="11" fill="#2E7D6B" text-anchor="end">3m 以下</text>

  <!-- 隙間 -->
  <line x1="446" y1="186" x2="446" y2="212" stroke="#2E7D6B" stroke-width="0.6"/>
  <line x1="430" y1="206" x2="478" y2="206" stroke="#2E7D6B" stroke-width="1.2"/>
  <path d="M443 209 L449 203 M459 209 L465 203" stroke="#2E7D6B" stroke-width="1.2"/>
  <text x="440" y="228" font-size="11" fill="#2E7D6B" text-anchor="end">隙間 6cm 以上</text>

  <!-- 引き出し -->
  <line x1="222" y1="160" x2="196" y2="200" stroke="#141414" stroke-width="0.6"/>
  <rect x="192" y="198" width="4" height="4" fill="#141414"/>
  <text x="186" y="206" font-size="10.5" fill="#141414" text-anchor="end">斜め部材 V 字 1 組</text>
  <text x="186" y="221" font-size="10.5" fill="#5c5c5a" text-anchor="end">下端を近接させる</text>
  <text x="60" y="244" font-size="10.5" fill="#5c5c5a">斜め部材の組数は告示の式による。張り間・けた行の両方向に配置</text>
  <text x="310" y="66" font-size="10.5" fill="#5c5c5a">吊りボルト</text>

  <!-- 規定一覧 -->
  <text x="508" y="44" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1.2" fill="#9a9a96">告示771号 第3第2項</text>
  <g font-size="11" fill="#141414">
    <text x="508" y="70">質量 20kg/m² 以下</text>
    <text x="508" y="94">吊り材 1 本/m² 以上</text>
    <text x="508" y="132">吊り長さ 3m 以下・均一</text>
    <text x="508" y="156">天井面に段差を設けない</text>
    <text x="508" y="180">斜め部材を両方向に配置</text>
    <text x="508" y="204">壁等との隙間 6cm 以上</text>
  </g>
  <text x="508" y="108" font-size="10.5" fill="#5c5c5a">(6kg/m² 以下は 0.5 本以上)</text>
  <text x="508" y="224" font-size="10.5" fill="#5c5c5a">特別な調査・研究で衝突しない</text>
  <text x="508" y="239" font-size="10.5" fill="#5c5c5a">隙間を求めた場合はそれによる</text>

  <line x1="20" y1="256" x2="700" y2="256" stroke="#e6e6e2" stroke-width="1"/>
  <text x="20" y="274" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#5c5c5a"><tspan fill="#9a9a96">参考</tspan><tspan dx="10">隙間なし仕様(第3第3項)は斜め部材を設けず、周囲の壁等を介して躯体へ力を伝える</tspan></text>
</svg>
