<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>テーブル席の椅子後方と通路の寸法</title>
  <defs>
    <marker id="tka" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 7 L7 1" stroke="#2E7D6B" stroke-width="1.2"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a96" stroke-width="0.6"/></pattern>
  </defs>

  <text x="20" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">PLAN — 平面</text>

  <!-- 壁 -->
  <rect x="40" y="44" width="10" height="186" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>

  <!-- 1 列目:椅子(引いた状態)・テーブル・椅子 -->
  <g fill="#f5f5f2" stroke="#141414" stroke-width="1">
    <rect x="175" y="76" width="70" height="120"/>
    <rect x="455" y="76" width="70" height="120"/>
  </g>
  <g fill="none" stroke="#141414" stroke-width="0.8">
    <rect x="130" y="88" width="42" height="42"/><rect x="130" y="142" width="42" height="42"/>
    <rect x="248" y="88" width="42" height="42"/><rect x="248" y="142" width="42" height="42"/>
    <rect x="410" y="88" width="42" height="42"/><rect x="410" y="142" width="42" height="42"/>
    <rect x="528" y="88" width="42" height="42"/><rect x="528" y="142" width="42" height="42"/>
  </g>
  <!-- 背もたれ -->
  <g stroke="#141414" stroke-width="1.6">
    <line x1="132" y1="90" x2="132" y2="128"/><line x1="132" y1="144" x2="132" y2="182"/>
    <line x1="288" y1="90" x2="288" y2="128"/><line x1="288" y1="144" x2="288" y2="182"/>
    <line x1="412" y1="90" x2="412" y2="128"/><line x1="412" y1="144" x2="412" y2="182"/>
    <line x1="568" y1="90" x2="568" y2="128"/><line x1="568" y1="144" x2="568" y2="182"/>
  </g>
  <text x="210" y="140" font-size="10.5" fill="#5c5c5a" text-anchor="middle">テーブル</text>
  <text x="490" y="140" font-size="10.5" fill="#5c5c5a" text-anchor="middle">テーブル</text>

  <!-- 寸法 -->
  <g stroke="#2E7D6B" stroke-width="0.6">
    <line x1="130" y1="186" x2="130" y2="226"/><line x1="290" y1="186" x2="290" y2="226"/><line x1="410" y1="186" x2="410" y2="226"/>
  </g>
  <line x1="50" y1="220" x2="130" y2="220" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <line x1="290" y1="220" x2="410" y2="220" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <text x="90" y="214" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#2E7D6B" text-anchor="middle">600–800</text>
  <text x="350" y="214" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#2E7D6B" text-anchor="middle">900–1200</text>
  <text x="90" y="244" font-size="11" fill="#141414" text-anchor="middle">椅子を引いた後方</text>
  <text x="90" y="259" font-size="10.5" fill="#5c5c5a" text-anchor="middle">最低 600・推奨 800</text>
  <text x="350" y="244" font-size="11" fill="#141414" text-anchor="middle">2人がすれ違う通路</text>
  <text x="350" y="259" font-size="10.5" fill="#5c5c5a" text-anchor="middle">有効幅の目安</text>

  <!-- 右の注記 -->
  <line x1="600" y1="44" x2="600" y2="230" stroke="#e6e6e2" stroke-width="1"/>
  <text x="612" y="64" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1.2" fill="#9a9a96">NOTE</text>
  <g font-size="10.5" fill="#5c5c5a">
    <text x="612" y="86">車椅子対応</text>
    <text x="612" y="102">テーブル下</text>
    <text x="612" y="116">有効 700 以上</text>
    <text x="612" y="136">アプローチ幅</text>
    <text x="612" y="150">900 以上</text>
    <text x="612" y="170">回転は直径</text>
    <text x="612" y="184">1500 程度</text>
  </g>

  <text x="20" y="282" font-size="10.5" fill="#5c5c5a">寸法は目安 [mm]。椅子の形状・天板の大きさで変わるので、実物かモックアップで確かめる</text>
</svg>
