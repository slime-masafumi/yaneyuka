<svg xmlns="http://www.w3.org/2000/svg" fill="#141414" viewBox="0 0 720 330" width="720" height="330" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>常用・非常電源の切替と給電までの時間</title>
  <style>
    text{font-size:11px}
    .s{font-size:10.5px;fill:#5c5c5a}
    .m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px}
    .t{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:1.2px;fill:#9a9a96}
    .a{fill:#2E7D6B}
    .k{stroke:#141414;stroke-width:1;fill:none}
    .b{stroke:#141414;stroke-width:1;fill:#f5f5f2}
    .g{stroke:#9a9a96;stroke-width:.8;fill:none}
    .d{stroke-dasharray:3 3}
    .c{stroke:#2E7D6B;stroke-width:1.4;fill:none}
    .h{stroke:#e6e6e2;stroke-width:1}
  </style>
  <defs>
    <marker id="ta" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 7 L7 1" stroke="#2E7D6B" stroke-width="1.2"/></marker>
  </defs>

  <text x="20" y="24" class="t">DIAGRAM — 系統</text>

  <!-- 常用 -->
  <text x="20" y="66">商用電源</text>
  <text x="20" y="82" class="s">受変電設備</text>
  <circle cx="104" cy="90" r="8" class="k"/><circle cx="116" cy="90" r="8" class="k"/>
  <path class="k" d="M124 90 H260 M180 90 V56 H330"/>
  <text x="338" y="60">一般負荷</text>
  <text x="404" y="60" class="s">停電で止まる</text>

  <!-- 発電機 -->
  <circle cx="110" cy="150" r="14" class="k"/>
  <text x="110" y="154" class="m" text-anchor="middle">G</text>
  <text x="20" y="180">非常用発電機</text>
  <text x="20" y="196" class="s">自動始動盤で起動</text>
  <line x1="124" y1="150" x2="260" y2="150" class="c"/>

  <!-- ATS -->
  <rect x="260" y="78" width="56" height="86" class="b"/>
  <text x="288" y="118" class="m" text-anchor="middle">ATS</text>
  <text x="288" y="134" class="s" text-anchor="middle">切替</text>
  <line x1="316" y1="121" x2="360" y2="121" class="c"/>
  <rect x="360" y="105" width="78" height="32" class="b"/>
  <text x="399" y="125" text-anchor="middle">非常電源盤</text>
  <path class="c" d="M438 121 H470 M470 82 V172 M470 82 H490 M470 112 H490 M470 142 H490 M470 172 H490"/>
  <text x="498" y="86">排煙機</text>
  <text x="498" y="116">消火ポンプ</text>
  <text x="498" y="146">非常用エレベーター</text>
  <text x="498" y="176">防災センター・非常放送</text>

  <!-- 時間 -->
  <line x1="20" y1="208" x2="700" y2="208" class="h"/>
  <text x="20" y="230" class="t">TIMELINE — 停電から</text>
  <path class="g d" d="M60 272 H320"/>
  <line x1="320" y1="272" x2="690" y2="272" stroke="#141414" stroke-width="2"/>
  <path class="k" d="M60 266 V278 M320 266 V278"/>
  <text x="60" y="292" class="m" text-anchor="middle">0s</text>
  <text x="72" y="292" class="s">停電</text>
  <text x="320" y="292" class="m" text-anchor="middle">40s</text>
  <line x1="60" y1="252" x2="320" y2="252" class="c" marker-start="url(#ta)" marker-end="url(#ta)"/>
  <text x="190" y="246" class="a" text-anchor="middle">始動 → 電圧確立 → 投入 40 秒以内</text>
  <text x="330" y="264">非常負荷へ給電</text>
  <text x="426" y="264" class="s">運転時間は燃料の量で決まる</text>

  <text x="20" y="318" class="s">非常照明は停電と同時に蓄電池で点灯し 30 分以上(告示第1830号)。誘導灯の蓄電池は 20 分以上。</text>
</svg>
