<svg xmlns="http://www.w3.org/2000/svg" fill="#141414" viewBox="0 0 720 306" width="720" height="306" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>誘導灯の区分と有効範囲(歩行距離)</title>
  <style>
    text{font-size:11px}
    .s{font-size:10.5px;fill:#5c5c5a}
    .m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px}
    .n{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9.5px;fill:#5c5c5a}
    .t{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:1.2px;fill:#9a9a96}
    .a{fill:#2E7D6B}
    .k{stroke:#141414;stroke-width:1;fill:none}
    .g{stroke:#9a9a96;stroke-width:.8;fill:none}
    .h{stroke:#e6e6e2;stroke-width:1}
    .r{fill:none;stroke:#2E7D6B;stroke-width:1.2}
  </style>

  <text x="20" y="24" class="t">CHART — 有効範囲</text>

  <!-- 目盛 -->
  <path class="h" d="M260 60 V254 M320 60 V254 M380 60 V254 M440 60 V254 M500 60 V254 M560 60 V254"/>
  <line x1="200" y1="60" x2="200" y2="254" class="g"/>
  <line x1="200" y1="254" x2="560" y2="254" class="k"/>
  <g class="n" text-anchor="middle">
    <text x="200" y="268">0</text><text x="260" y="268">10</text><text x="320" y="268">20</text><text x="380" y="268">30</text>
    <text x="440" y="268">40</text><text x="500" y="268">50</text><text x="560" y="268">60m</text>
  </g>
  <text x="80" y="56" class="s">表示面の縦寸法</text>

  <!-- 避難口誘導灯 -->
  <text x="20" y="76">避難口誘導灯</text>
  <text x="40" y="98">A級</text><text x="80" y="98" class="m">0.4m 以上</text>
  <rect x="200" y="89" width="360" height="12" class="r"/>
  <line x1="440" y1="85" x2="440" y2="105" stroke="#2E7D6B" stroke-width="1.2" stroke-dasharray="2 2"/>
  <text x="568" y="99" class="m">60m</text><text x="598" y="99" class="s">矢印付き 40m</text>
  <text x="40" y="120">B級</text><text x="80" y="120" class="m">0.2〜0.4m</text>
  <rect x="200" y="111" width="180" height="12" class="r"/>
  <line x1="320" y1="107" x2="320" y2="127" stroke="#2E7D6B" stroke-width="1.2" stroke-dasharray="2 2"/>
  <text x="388" y="121" class="m">30m</text><text x="418" y="121" class="s">矢印付き 20m</text>
  <text x="40" y="142">C級</text><text x="80" y="142" class="m">0.1〜0.2m</text>
  <rect x="200" y="133" width="90" height="12" class="r"/>
  <text x="298" y="143" class="m">15m</text>

  <!-- 通路誘導灯 -->
  <text x="20" y="176">通路誘導灯</text>
  <text x="40" y="198">A級</text><text x="80" y="198" class="m">0.4m 以上</text>
  <rect x="200" y="189" width="120" height="12" class="r"/>
  <text x="328" y="199" class="m">20m</text>
  <text x="40" y="220">B級</text><text x="80" y="220" class="m">0.2〜0.4m</text>
  <rect x="200" y="211" width="90" height="12" class="r"/>
  <text x="298" y="221" class="m">15m</text>
  <text x="40" y="242">C級</text><text x="80" y="242" class="m">0.1〜0.2m</text>
  <rect x="200" y="233" width="60" height="12" class="r"/>
  <text x="268" y="243" class="m">10m</text>

  <line x1="20" y1="278" x2="700" y2="278" class="h"/>
  <text x="20" y="296" class="s">有効範囲 = 誘導灯までの歩行距離(消防法施行規則 第28条の3)。矢印付き = 避難の方向を示すシンボルのあるもの。</text>
</svg>
