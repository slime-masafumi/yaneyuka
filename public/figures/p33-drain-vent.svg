  <path d="M136 154 L140 166 H160 L164 154" fill="#f5f5f2" stroke="#141414" stroke-width="1"/><path d="M136 234 L140 246 H160 L164 234" fill="#f5f5f2" stroke="#141414" stroke-width="1"/><path d="M216 154 L220 166 H240 L244 154" fill="#f5f5f2" stroke="#141414" stroke-width="1"/><path d="M216 234 L220 246 H240 L244 234" fill="#f5f5f2" stroke="#141414" stroke-width="1"/><path d="M296 154 L300 166 H320 L324 154" fill="#f5f5f2" stroke="#141414" stroke-width="1"/><path d="M296 234 L300 246 H320 L324 234" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <path d="M150 166 V186 a6 6 0 0 0 12 0 V182 H170 V193.4" fill="none" stroke="#141414" stroke-width="1"/><path d="M150 246 V266 a6 6 0 0 0 12 0 V262 H170 V273.4" fill="none" stroke="#141414" stroke-width="1"/><path d="M230 166 V186 a6 6 0 0 0 12 0 V182 H250 V196.1" fill="none" stroke="#141414" stroke-width="1"/><path d="M230 246 V266 a6 6 0 0 0 12 0 V262 H250 V276.1" fill="none" stroke="#141414" stroke-width="1"/><path d="M310 166 V186 a6 6 0 0 0 12 0 V182 H330 V198.9" fill="none" stroke="#141414" stroke-width="1"/><path d="M310 246 V266 a6 6 0 0 0 12 0 V262 H330 V278.9" fill="none" stroke="#141414" stroke-width="1"/>
  <!-- 排水(黒) -->
  <g fill="none" stroke="#141414" stroke-width="1.4">
    <path d="M130 192 L420 202"/>
    <path d="M130 272 L420 282"/>
    <path d="M420 202 V340 L600 346"/>
  </g>
  <rect x="413" y="340" width="14" height="8" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <rect x="600" y="330" width="34" height="36" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <!-- 通気(主題) -->
  <g fill="none" stroke="#2E7D6B" stroke-width="1.4">
    <path d="M420 202 V52"/>
    <path d="M412 52 H428"/>
    <path d="M170 112 H420"/>
    <path d="M170 182 V112"/><path d="M250 182 V112"/><path d="M330 182 V112"/>
    <path d="M420 318 L460 298 V124 H420"/>
    <path d="M200 274.4 V214 H413 M427 214 H460"/>
