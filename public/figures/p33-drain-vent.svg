<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>排水・通気系統の構成</title>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a96" stroke-width="0.6"/></pattern>
  </defs>
  <text x="20" y="22" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">DIAGRAM — 排水・通気系統</text>
  <!-- 建物 -->
  <rect x="100" y="90" width="440" height="6" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <rect x="100" y="170" width="440" height="6" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <rect x="100" y="250" width="440" height="6" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <line x1="100" y1="96" x2="100" y2="330" stroke="#141414" stroke-width="1"/>
  <line x1="540" y1="96" x2="540" y2="330" stroke="#141414" stroke-width="1"/>
  <line x1="20" y1="330" x2="700" y2="330" stroke="#9a9a96" stroke-width="1"/>
  <text x="106" y="112" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1" fill="#9a9a96">3F</text>
  <text x="106" y="192" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1" fill="#9a9a96">2F</text>
  <text x="106" y="272" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1" fill="#9a9a96">1F</text>
