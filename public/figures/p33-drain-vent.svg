  <!-- ラベル -->
  <text x="432" y="66" font-size="11" fill="#2E7D6B">伸頂通気管</text>
  <text x="468" y="200" font-size="11" fill="#2E7D6B">通気立管</text>
  <text x="176" y="106" font-size="11" fill="#2E7D6B">各個通気管</text>
  <text x="276" y="208" font-size="11" fill="#2E7D6B">ループ通気管</text>
  <text x="412" y="314" font-size="11" fill="#141414" text-anchor="end">排水立管</text>
  <text x="408" y="366" font-size="10.5" fill="#5c5c5a" text-anchor="end">掃除口</text>
  <text x="617" y="384" font-size="10.5" fill="#5c5c5a" text-anchor="middle">排水ます</text>
  <text x="560" y="358" font-size="10.5" fill="#5c5c5a" text-anchor="end">排水横主管</text>
  <line x1="156" y1="194" x2="92" y2="214" stroke="#141414" stroke-width="0.6"/>
  <rect x="88" y="212" width="4" height="4" fill="#141414"/>
  <text x="24" y="218" font-size="11" fill="#141414">トラップ</text>
  <line x1="262" y1="278" x2="246" y2="296" stroke="#141414" stroke-width="0.6"/>
  <rect x="244" y="294" width="4" height="4" fill="#141414"/>
  <text x="140" y="312" font-size="11" fill="#141414">排水横枝管(勾配)</text>
  <text x="20" y="392" font-size="10.5" fill="#5c5c5a">通気の横走り部は器具のあふれ縁より上で配管する(模式図)</text>
</svg>
