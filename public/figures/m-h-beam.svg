<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>H形鋼の断面と寸法記号</title>
  <defs>
    <marker id="tk" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 7 L7 1" stroke="#141414" stroke-width="1"/></marker>
    <marker id="tka" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 7 L7 1" stroke="#2E7D6B" stroke-width="1.2"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a96" stroke-width="0.6"/></pattern>
  </defs>

  <text x="20" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">SECTION — 断面</text>
  <text x="380" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">SYMBOLS — 記号</text>
  <line x1="360" y1="16" x2="360" y2="300" stroke="#e6e6e2" stroke-width="1"/>

  <!-- 断面(H-300×150×6.5×9 の比率、r=13) -->
  <path d="M110,56 H230 V63.2 H183 A10.4,10.4 0 0 0 172.6,73.6 V278.4 A10.4,10.4 0 0 0 183,288.8 H230 V296 H110 V288.8 H157 A10.4,10.4 0 0 0 167.4,278.4 V73.6 A10.4,10.4 0 0 0 157,63.2 H110 Z" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>

  <!-- 軸 -->
  <line x1="84" y1="176" x2="262" y2="176" stroke="#9a9a96" stroke-width="0.8" stroke-dasharray="6 3 1 3"/>
  <line x1="170" y1="48" x2="170" y2="306" stroke="#9a9a96" stroke-width="0.8" stroke-dasharray="6 3 1 3"/>
  <text x="268" y="180" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#5c5c5a">X</text>
  <text x="72" y="180" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#5c5c5a">X</text>
  <text x="176" y="312" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#5c5c5a">Y</text>

  <!-- H -->
  <line x1="106" y1="56" x2="52" y2="56" stroke="#9a9a96" stroke-width="0.6"/>
  <line x1="106" y1="296" x2="52" y2="296" stroke="#9a9a96" stroke-width="0.6"/>
  <line x1="58" y1="56" x2="58" y2="296" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <text x="50" y="222" font-size="12" fill="#2E7D6B" text-anchor="end">H</text>

  <!-- B -->
  <line x1="110" y1="52" x2="110" y2="34" stroke="#9a9a96" stroke-width="0.6"/>
  <line x1="230" y1="52" x2="230" y2="34" stroke="#9a9a96" stroke-width="0.6"/>
  <line x1="110" y1="40" x2="230" y2="40" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <text x="140" y="35" font-size="12" fill="#2E7D6B" text-anchor="middle">B</text>

  <!-- tw -->
  <line x1="148" y1="226" x2="167.4" y2="226" stroke="#2E7D6B" stroke-width="1.2" marker-end="url(#tka)"/>
  <line x1="172.6" y1="226" x2="194" y2="226" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)"/>
  <text x="200" y="230" font-size="12" fill="#2E7D6B">tw</text>

  <!-- tf -->
  <line x1="234" y1="56" x2="262" y2="56" stroke="#9a9a96" stroke-width="0.6"/>
  <line x1="234" y1="63.2" x2="262" y2="63.2" stroke="#9a9a96" stroke-width="0.6"/>
  <line x1="256" y1="40" x2="256" y2="56" stroke="#2E7D6B" stroke-width="1.2" marker-end="url(#tka)"/>
  <line x1="256" y1="63.2" x2="256" y2="80" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)"/>
  <text x="266" y="76" font-size="12" fill="#2E7D6B">tf</text>

  <!-- r -->
  <line x1="181" y1="72" x2="206" y2="100" stroke="#141414" stroke-width="0.6"/>
  <rect x="204" y="98" width="4" height="4" fill="#141414"/>
  <text x="212" y="105" font-size="12" fill="#141414">r</text>

  <!-- 記号の説明 -->
  <g font-size="11" fill="#141414">
    <text x="380" y="58"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2E7D6B">H </tspan><tspan x="414">せい(高さ)</tspan></text>
    <text x="380" y="82"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2E7D6B">B </tspan><tspan x="414">フランジ幅</tspan></text>
    <text x="380" y="106"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2E7D6B">tw</tspan><tspan x="414">ウェブの厚さ(JIS の表記は t1)</tspan></text>
    <text x="380" y="130"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2E7D6B">tf</tspan><tspan x="414">フランジの厚さ(JIS の表記は t2)</tspan></text>
    <text x="380" y="154"><tspan font-family="ui-monospace,Menlo,Consolas,monospace">r </tspan><tspan x="414">フィレット(ウェブとフランジの隅)の半径</tspan></text>
    <text x="380" y="178"><tspan font-family="ui-monospace,Menlo,Consolas,monospace">Ix</tspan><tspan x="414">強軸 X–X まわりの断面二次モーメント</tspan></text>
  </g>
  <line x1="380" y1="198" x2="700" y2="198" stroke="#e6e6e2" stroke-width="1"/>
  <text x="380" y="222" font-size="11" fill="#141414">呼称は H×B×tw×tf の順に書く</text>
  <text x="380" y="246" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#5c5c5a"><tspan fill="#9a9a96">例</tspan><tspan dx="8">H-300×150×6.5×9</tspan></text>
  <text x="380" y="266" font-size="10.5" fill="#5c5c5a">→ H=300・B=150・tw=6.5・tf=9(mm)</text>
  <text x="380" y="290" font-size="10.5" fill="#5c5c5a">図はこの寸法の比率(r=13)で描いている</text>
</svg>
