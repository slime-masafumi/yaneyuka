<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>ガス漏れ検知器の設置位置</title>
  <defs>
    <marker id="tka" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 7 L7 1" stroke="#2E7D6B" stroke-width="1.2"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a96" stroke-width="0.6"/></pattern>
  </defs>
  <text x="20" y="22" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">SECTION — 断面</text>
  <line x1="360" y1="40" x2="360" y2="292" stroke="#e6e6e2" stroke-width="1"/>

  <!-- ===== 軽いガス ===== -->
  <rect x="20" y="48" width="320" height="12" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <rect x="20" y="230" width="320" height="8" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <rect x="70" y="60" width="240" height="24" fill="#eef6f3" stroke="#2E7D6B" stroke-width="0.8" stroke-dasharray="3 3"/>
  <rect x="250" y="62" width="18" height="10" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <text x="259" y="100" font-size="10.5" fill="#141414" text-anchor="middle">検知器</text>
  <rect x="40" y="196" width="60" height="34" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <path d="M54 196 V190 M86 196 V190" stroke="#141414" stroke-width="1"/>
  <text x="70" y="218" font-size="10.5" fill="#141414" text-anchor="middle">燃焼器</text>
  <line x1="70" y1="84" x2="70" y2="190" stroke="#9a9a96" stroke-width="0.6" stroke-dasharray="3 3"/>
  <line x1="70" y1="124" x2="310" y2="124" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <line x1="310" y1="84" x2="310" y2="130" stroke="#2E7D6B" stroke-width="0.6"/>
  <text x="190" y="118" font-size="11" fill="#2E7D6B" text-anchor="middle">水平距離 8m 以内</text>
  <line x1="324" y1="60" x2="324" y2="84" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <line x1="310" y1="84" x2="330" y2="84" stroke="#2E7D6B" stroke-width="0.6"/>
  <text x="329" y="76" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#2E7D6B">0.3m</text>
  <text x="20" y="260" font-size="11" fill="#141414">空気より軽いガス(都市ガス 13A 等)</text>
  <text x="20" y="276" font-size="10.5" fill="#5c5c5a">検知器の下端を天井面等の下方 0.3m 以内</text>
  <text x="20" y="292" font-size="10.5" fill="#5c5c5a">0.6m 以上突き出したはりがあれば燃焼器側に</text>

  <!-- ===== 重いガス ===== -->
  <rect x="380" y="48" width="320" height="12" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <rect x="380" y="230" width="320" height="8" fill="url(#hatch)" stroke="#141414" stroke-width="1"/>
  <rect x="430" y="206" width="120" height="24" fill="#eef6f3" stroke="#2E7D6B" stroke-width="0.8" stroke-dasharray="3 3"/>
  <rect x="400" y="196" width="60" height="34" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <path d="M414 196 V190 M446 196 V190" stroke="#141414" stroke-width="1"/>
  <text x="430" y="218" font-size="10.5" fill="#141414" text-anchor="middle">燃焼器</text>
  <rect x="514" y="216" width="18" height="10" fill="#f5f5f2" stroke="#141414" stroke-width="1"/>
  <text x="523" y="200" font-size="10.5" fill="#141414" text-anchor="middle">検知器</text>
  <line x1="430" y1="150" x2="430" y2="190" stroke="#9a9a96" stroke-width="0.6" stroke-dasharray="3 3"/>
  <line x1="430" y1="166" x2="550" y2="166" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <line x1="550" y1="160" x2="550" y2="206" stroke="#2E7D6B" stroke-width="0.6"/>
  <text x="490" y="160" font-size="11" fill="#2E7D6B" text-anchor="middle">水平距離 4m 以内</text>
  <line x1="564" y1="206" x2="564" y2="230" stroke="#2E7D6B" stroke-width="1.2" marker-start="url(#tka)" marker-end="url(#tka)"/>
  <line x1="550" y1="206" x2="570" y2="206" stroke="#2E7D6B" stroke-width="0.6"/>
  <text x="572" y="222" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#2E7D6B">0.3m</text>
  <text x="380" y="260" font-size="11" fill="#141414">空気より重いガス(LP ガス)</text>
  <text x="380" y="276" font-size="10.5" fill="#5c5c5a">検知器の上端を床面の上方 0.3m 以内</text>
  <text x="380" y="292" font-size="10.5" fill="#5c5c5a">消防法施行規則 第24条の2の3 / 高さ方向は誇張</text>
</svg>
