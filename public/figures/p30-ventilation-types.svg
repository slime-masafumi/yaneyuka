roke-width="0.8" stroke-dasharray="3 3" marker-end="url(#ar)"/><path d="M447 150 H465" stroke="#9a9a96" stroke-width="0.8" marker-end="url(#ar)"/><text x="360" y="170" font-size="10.5" fill="#141414" text-anchor="middle">室内 正圧(＋)</text><text x="253" y="202" font-size="11" fill="#141414">クリーンルーム・無菌室</text><text x="253" y="218" font-size="10.5" fill="#5c5c5a">外からの汚染の侵入を防ぐ</text><text x="486" y="52" font-size="12" fill="#141414">第3種換気</text><text x="486" y="68" font-size="10.5" fill="#5c5c5a">給気 自然 ／ 排気 機械</text><path d="M520 100 V82 H666 V140 M666 160 V178 H520 V120" fill="none" stroke="#141414" stroke-width="1"/><g stroke="#141414" stroke-width="0.8"><line x1="514" y1="104" x2="526" y2="104"/><line x1="514" y1="110" x2="526" y2="110"/><line x1="514" y1="116" x2="526" y2="116"/></g><circle cx="666" cy="150" r="10" fill="#eef6f3" stroke="#2E7D6B" stroke-width="1.4"/><text x="666" y="153.5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#2E7D6B" text-anchor="middle">F</text><path d="M490 110 H506" stroke="#9a9a96" stroke-width="0.8" marker-end="url(#ar)"/><path d="M536 110 C590 110 596 150 650 150" fill="none" stroke="#9a9a96" stroke-width="0.8" stroke-dasharray="3 3" marker-end="url(#ar)"/><path d="M680 150 H698" stroke="#9a9a96" stroke-width="0.8" marker-end="url(#ar)"/><text x="593" y="170" font-size="10.5" fill="#141414" text-anchor="middle">室内 負圧(−)</text><text x="486" y="202" font-size="11" fill="#141414">住宅・トイレ・倉庫</text><text x="486" y="218" font-size="10.5" fill="#5c5c5a">臭気・湿気を室外へ出さない</text>
  <line x1="20" y1="238" x2="700" y2="238" stroke="#e6e6e2" stroke-width="1"/>
  <circle cx="30" cy="260" r="10" fill="#eef6f3" stroke="#2E7D6B" stroke-width="1.4"/><text x="30" y="263.5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#2E7D6B" text-anchor="middle">F</text><text x="46" y="264" font-size="10.5" fill="#5c5c5a">送風機(機械)</text>
