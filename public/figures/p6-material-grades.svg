<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>不燃・準不燃・難燃材料の性能時間</title>

  <text x="20" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#9a9a96">DIAGRAM — 加熱時間</text>

  <!-- 目盛り(0〜20分、24px/分) -->
  <g stroke="#9a9a96" stroke-width="0.8" stroke-dasharray="3 3">
    <line x1="270" y1="40" x2="270" y2="168"/>
    <line x1="390" y1="40" x2="390" y2="168"/>
    <line x1="630" y1="40" x2="630" y2="168"/>
  </g>
  <line x1="150" y1="168" x2="660" y2="168" stroke="#141414" stroke-width="1"/>
  <g stroke="#141414" stroke-width="1">
    <line x1="150" y1="164" x2="150" y2="172"/>
    <line x1="270" y1="164" x2="270" y2="172"/>
    <line x1="390" y1="164" x2="390" y2="172"/>
    <line x1="510" y1="164" x2="510" y2="172"/>
    <line x1="630" y1="164" x2="630" y2="172"/>
  </g>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#141414" text-anchor="middle">
    <text x="150" y="186">0</text>
    <text x="270" y="186" fill="#2E7D6B">5</text>
    <text x="390" y="186" fill="#2E7D6B">10</text>
    <text x="510" y="186">15</text>
    <text x="630" y="186" fill="#2E7D6B">20 分</text>
  </g>
  <text x="150" y="204" font-size="10.5" fill="#5c5c5a">通常の火災による火熱を加えたときの加熱開始後の時間</text>

  <!-- 帯 -->
  <g fill="#f5f5f2" stroke="#141414" stroke-width="1">
    <rect x="150" y="50" width="480" height="24"/>
    <rect x="150" y="92" width="240" height="24"/>
    <rect x="150" y="134" width="120" height="24"/>
  </g>
  <g stroke="#2E7D6B" stroke-width="1.5">
    <line x1="630" y1="46" x2="630" y2="78"/>
    <line x1="390" y1="88" x2="390" y2="120"/>
    <line x1="270" y1="130" x2="270" y2="162"/>
  </g>
  <g font-size="12" fill="#141414" text-anchor="end">
    <text x="138" y="67">不燃材料</text>
    <text x="138" y="109">準不燃材料</text>
    <text x="138" y="151">難燃材料</text>
  </g>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#5c5c5a">
    <text x="160" y="66">法2条9号・令108条の2 / 平12建告1400号</text>
    <text x="160" y="108">令1条5号 / 平12建告1401号</text>
    <text x="160" y="150">令1条6号</text>
    <text x="280" y="150">平12建告1402号</text>
  </g>

  <!-- 要件 -->
  <line x1="20" y1="218" x2="700" y2="218" stroke="#e6e6e2" stroke-width="1"/>
  <text x="20" y="236" font-size="10.5" fill="#5c5c5a"><tspan fill="#141414">要件(令108条の2)</tspan>  燃焼しない ・ 防火上有害な変形・溶融・き裂等を生じない ・ 避難上有害な煙・ガスを出さない</text>
  <text x="20" y="252" font-size="10.5" fill="#5c5c5a">外部の仕上げは前の 2 つ。上位の材料は下位の材料として使える(不燃 ⊂ 準不燃 ⊂ 難燃)</text>
</svg>
